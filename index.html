<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Glide Planner – Version Finale Stable</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body {
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:Inter, system-ui, sans-serif;
}

/* --- MAP --- */
#map {
  position:fixed;
  inset:0;
  z-index:1;
  transition:filter .25s ease;
  touch-action:pan-x pan-y pinch-zoom;
}

/* flou appliqué directement sur la carte */
.map-blurred {
  filter:blur(6px) brightness(.55);
  pointer-events:none;
}

/* --- SCREENS --- */
.screen {
  position:fixed;
  inset:0;
  display:none;
  z-index:10;
  color:white;
  text-align:center;
  padding-top:80px;
}

#homeScreen, #manuelScreen {
  backdrop-filter:blur(4px);
  background:rgba(0,0,0,0.35);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

button {
  padding:14px 20px;
  border-radius:10px;
  border:none;
  font-size:18px;
  cursor:pointer;
  margin:10px;
  background:white;
  color:black;
  font-weight:bold;
  z-index:20;
  position:relative;
}

/* PREPARATION PANELS */
.panel {
  position:absolute;
  width:320px;
  background:rgba(255,255,255,0.96);
  border-radius:12px;
  padding:12px;
  box-shadow:0 6px 18px rgba(0,0,0,0.18);
  z-index:2000;
  max-height:78vh;
  overflow:auto;
  border:1px solid rgba(20,20,20,0.04);
  touch-action:none;
}

.toggleBtn {
  position:absolute;
  right:12px;
  z-index:2100;
  background:#1f6feb;
  color:white;
  padding:10px;
  border-radius:10px;
  border:none;
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(31,111,235,0.18);
}

.toggleBtn.top { top:12px; }
.toggleBtn.second { top:72px; }

.backBtn {
  position:absolute;
  top:12px;
  left:12px;
  z-index:2200;
  background:rgba(0,0,0,0.7);
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,0.25);
}
</style>
</head>
<script>
/* ============================================================
   NAVIGATION ENTRE LES ÉCRANS + GESTION DU FLOU / INTERACTIONS
   ============================================================ */

function enableMap() {
  map.dragging.enable();
  map.scrollWheelZoom.enable();
  map.touchZoom.enable();
  map.doubleClickZoom.enable();
  map.boxZoom.enable();
  map.keyboard.enable();
  document.getElementById("map").style.pointerEvents = "auto";
}

function disableMap() {
  map.dragging.disable();
  map.scrollWheelZoom.disable();
  map.touchZoom.disable();
  map.doubleClickZoom.disable();
  map.boxZoom.disable();
  map.keyboard.disable();
  document.getElementById("map").style.pointerEvents = "none";
}

function goTo(screenId) {
  const screens = ["homeScreen", "prepScreen", "volScreen", "manuelScreen"];
  screens.forEach(id => {
    const el = document.getElementById(id);
    el.style.display = "none";
  });

  const mapEl = document.getElementById("map");

  if (screenId === "homeScreen" || screenId === "manuelScreen") {
    mapEl.classList.add("map-blurred");
    disableMap();
  } else {
    mapEl.classList.remove("map-blurred");
    enableMap();
    setTimeout(() => map.invalidateSize(), 150);
  }

  document.getElementById(screenId).style.display = "block";
}

/* ============================================================
   INITIALISATION DE LA CARTE
   ============================================================ */

const map = L.map('map', {
  preferCanvas: true,
  tap: true
}).setView([43.8, 0.1], 9);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

disableMap(); // Home par défaut → carte non interactive

/* ============================================================
   DOM ELEMENTS
   ============================================================ */

const panel = document.getElementById('panel');
const menuVent = document.getElementById('menuVent');
const btnPanel = document.getElementById('btnPanel');
const btnVent = document.getElementById('btnVent');
const btnRecalc = document.getElementById('btnRecalc');
const btnRecalcWind = document.getElementById('btnRecalcWind');

const hVal = document.getElementById('hVal');
const slider = document.getElementById('slider');
const finesse = document.getElementById('finesse');
const fb = document.getElementById('fb');
const seuil = document.getElementById('seuil');
const marge = document.getElementById('marge');
const vCruiseInput = document.getElementById('vCruise');
const mode = document.getElementById('mode');
const labels = document.getElementById('labels');
const all = document.getElementById('all');
const refSelect = document.getElementById('refSelect');
const rangeKm = document.getElementById('rangeKm');
const applyWind = document.getElementById('applyWind');

/* ============================================================
   TERRAINS
   ============================================================ */

let terrainsAll = [
  { id: "LFDA", lat: 43.709, lon: -0.249, alt: 80 },
  { id: "LFID", lat: 43.955, lon: 0.373, alt: 130 },
  { id: "LFCN", lat: 43.762, lon: -0.036, alt: 100 },
  { id: "LFDH", lat: 43.646, lon: 0.601, alt: 130 },
  { id: "LFBM", lat: 43.911, lon: -0.507, alt: 52 },
  { id: "LFCL", lat: 43.586, lon: 1.499, alt: 152 }
];

let terrains = [];

function populateRef() {
  refSelect.innerHTML = "";
  terrainsAll.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t.id;
    opt.innerText = t.id;
    refSelect.appendChild(opt);
  });
}
populateRef();

/* ============================================================
   OUTILS
   ============================================================ */

function distanceKm(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLon = (b.lon - a.lon) * Math.PI / 180;
  const x = Math.sin(dLat / 2) ** 2 +
    Math.cos(a.lat * Math.PI / 180) *
    Math.cos(b.lat * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}

function color(h) {
  const r = Math.round(255 * (1 - (h / 3000)));
  const g = Math.round(255 * (h / 3000));
  return `rgb(${r},${g},0)`;
}

/* ============================================================
   VENT
   ============================================================ */

const windLayers = [
  { label: "0-500", v: "v0", d: "d0" },
  { label: "500-1000", v: "v1", d: "d1" },
  { label: "1000-1500", v: "v2", d: "d2" },
  { label: "1500-2000", v: "v3", d: "d3" },
  { label: "2000-2500", v: "v4", d: "d4" },
  { label: "2500-3000", v: "v5", d: "d5" }
];

function initWindMenu() {
  const container = document.getElementById('windControls');
  container.innerHTML = '';
  windLayers.forEach(w => {
    const block = document.createElement('div');
    block.className = 'wind-row';
    block.innerHTML = `
      <div style="min-width:80px;"><b style="font-size:12px;">${w.label} m</b></div>
      <input type="range" id="${w.v}" min="0" max="50" value="0" style="flex:1;">
      <span id="${w.v}_label" style="width:60px;text-align:right;font-size:12px;">0 km/h</span>
      <input type="number" id="${w.d}" value="0" style="width:70px;">
    `;
    container.appendChild(block);

    const slider = block.querySelector(`#${w.v}`);
    const label = block.querySelector(`#${w.v}_label`);
    slider.addEventListener('input', () => { label.innerText = slider.value + ' km/h'; });
  });
}
initWindMenu();

function getWindForLayer(idx) {
  const layer = windLayers[Math.max(0, Math.min(windLayers.length - 1, idx))];
  const vEl = document.getElementById(layer.v);
  const dEl = document.getElementById(layer.d);
  const v = vEl ? parseFloat(vEl.value) : 0;
  const d = dEl ? parseFloat(dEl.value) : 0;
  return { v: isNaN(v) ? 0 : v, d: isNaN(d) ? 0 : d };
}

/* ============================================================
   CALCUL DES ZONES ATTEIGNABLES
   ============================================================ */

let objs = [];
let userPos = { lat: 43.8, lon: 0.1 };

map.on('moveend', () => {
  const c = map.getCenter();
  userPos = { lat: c.lat, lon: c.lng };
  update();
});

function clearObjs() {
  objs.forEach(o => map.removeLayer(o));
  objs = [];
}

function update() {
  clearObjs();

  const range = parseFloat(rangeKm.value) || 100;
  terrains = terrainsAll.filter(t => distanceKm(userPos, t) <= range);

  const h = parseInt(slider.value, 10) || 0;
  hVal.innerText = h;

  const f = parseFloat(finesse.value) || 30;
  const fbVal = parseFloat(fb.value) || 10;
  const seuilVal = parseFloat(seuil.value) || 500;
  const margeVal = parseFloat(marge.value) || 250;
  const vCruise = parseFloat(vCruiseInput.value) || 100;
  const modeVal = mode.value;
  const showLabels = labels.checked;
  const allVal = all.checked;
  const useWind = applyWind.checked;

  const ref = terrainsAll.find(t => t.id === refSelect.value);
  const refAlt = ref ? ref.alt : 0;

  terrains.forEach(t => {
    const hMin = allVal ? 0 : h;
    const hMax = allVal ? 3000 : h;

    for (let hh = hMin; hh <= hMax; hh += 100) {
      let h_rel;
      if (modeVal === "QFE") h_rel = hh;
      else if (modeVal === "QNH") h_rel = hh - t.alt;
      else h_rel = hh - (t.alt - refAlt);

      if (h_rel <= 0) continue;
      const finesseUse = (h_rel <= seuilVal) ? fbVal : f;
      const h_util = h_rel - margeVal;
      if (h_util <= 0) continue;

      const d = h_util * finesseUse;

      if (!useWind) {
        const circle = L.circle([t.lat, t.lon], { radius: d, color: color(hh), weight: 2, fill: false }).addTo(map);
        objs.push(circle);

        if (showLabels) {
          [0, 180].forEach(a => {
            const rad = a * Math.PI / 180;
            const latOff = (d / 111000) * Math.cos(rad);
            const lonOff = (d / (111000 * Math.cos(t.lat * Math.PI / 180))) * Math.sin(rad);
            objs.push(L.marker([t.lat + latOff, t.lon + lonOff], {
              icon: L.divIcon({ className: 'label', html: hh + "m-F" + Math.round(finesseUse) + "-" + t.id })
            }).addTo(map));
          });
        }
      } else {
        const polyPts = [];
        const step = 6;
        for (let a = 0; a < 360; a += step) {
          const alphaRad = a * Math.PI / 180;

          let layerIdx = Math.floor(hh / 500);
          if (layerIdx > windLayers.length - 1) layerIdx = windLayers.length - 1;
          const wind = getWindForLayer(layerIdx);
          const W = wind.v;
          const dir = wind.d;
          const dirRad = (dir + 180) * Math.PI / 180;

          const projWind = W * Math.cos(alphaRad - dirRad);

          let denom = vCruise - projWind;
          if (denom < 5) denom = 5;

          const effDist = d * (vCruise / denom);

          const latOff = (effDist / 111000) * Math.cos(alphaRad);
          const lonOff = (effDist / (111000 * Math.cos(t.lat * Math.PI / 180))) * Math.sin(alphaRad);

          polyPts.push([t.lat + latOff, t.lon + lonOff]);
        }

        const poly = L.polygon(polyPts, { color: color(hh), weight: 2, fill: false }).addTo(map);
        objs.push(poly);

        if (showLabels) {
          [0, 180].forEach(a => {
            const rad = a * Math.PI / 180;
            const latOff = (d / 111000) * Math.cos(rad);
            const lonOff = (d / (111000 * Math.cos(t.lat * Math.PI / 180))) * Math.sin(rad);
            objs.push(L.marker([t.lat + latOff, t.lon + lonOff], {
              icon: L.divIcon({ className: 'label', html: hh + "m-F" + Math.round(finesseUse) + "-" + t.id })
            }).addTo(map));
          });
        }
      }
    }

    objs.push(L.marker([t.lat, t.lon]).addTo(map));
  });
}

/* ============================================================
   AJOUT DE TERRAINS
   ============================================================ */

map.on('click', function (e) {
  const nom = prompt("Nom terrain ?");
  if (!nom) return;
  const altStr = prompt("Altitude m ?");
  const alt = parseFloat(altStr);
  if (isNaN(alt)) return;
  terrainsAll.push({ id: nom, lat: e.latlng.lat, lon: e.latlng.lng, alt: alt });
  populateRef();
  update();
});

/* ============================================================
   UI EVENTS
   ============================================================ */

slider.addEventListener('input', () => {
  hVal.innerText = slider.value;
  update();
});

btnRecalc.addEventListener('click', update);
btnRecalcWind.addEventListener('click', update);

[
  finesse, fb, seuil, marge, vCruiseInput,
  mode, labels, all, rangeKm, refSelect, applyWind
].forEach(el => {
  el.addEventListener('change', update);
});

/* ============================================================
   PANELS DRAGGABLE
   ============================================================ */

function makeDraggable(el) {
  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  function isFormControl(target) {
    if (!target) return false;
    return !!target.closest('input, select, textarea, button, label, [role="slider"], .no-drag');
  }

  el.addEventListener('pointerdown', function (e) {
    if (e.button && e.button !== 0) return;
    if (isFormControl(e.target)) return;

    dragging = true;
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    offsetX = e.clientX - el.offsetLeft;
    offsetY = e.clientY - el.offsetTop;
    el.style.cursor = 'grabbing';
    e.preventDefault();
  });

  el.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    let left = e.clientX - offsetX;
    let top = e.clientY - offsetY;
    left = Math.max(0, Math.min(window.innerWidth - el.offsetWidth, left));
    top = Math.max(0, Math.min(window.innerHeight - el.offsetHeight, top));
    el.style.left = left + 'px';
    el.style.top = top + 'px';
  });

  el.addEventListener('pointerup', function (e) {
    if (!dragging) return;
    dragging = false;
    try { el.releasePointerCapture(e.pointerId); } catch (err) {}
    el.style.cursor = 'default';
  });

  el.addEventListener('pointercancel', function () {
    dragging = false;
    el.style.cursor = 'default';
  });
}

makeDraggable(panel);
makeDraggable(menuVent);

/* ============================================================
   INITIALISATION
   ============================================================ */

update();
goTo("homeScreen");
</script>
<body>

<!-- MAP -->
<div id="map"></div>

<!-- HOME -->
<div id="homeScreen" class="screen">
  <h1>Glide Planner</h1>
  <button id="btnGoPrep">Préparation</button>
  <button id="btnGoVol">Mode Vol</button>
  <button id="btnGoManuel">Manuel</button>
</div>

<!-- PREPARATION -->
<div id="prepScreen" class="screen" style="color:black; text-shadow:none;">
  <button class="backBtn" id="backFromPrep">← Menu</button>

  <button id="btnPanel" class="toggleBtn top">⚙</button>
  <button id="btnVent" class="toggleBtn second">🌬</button>

  <div id="panel" class="panel" style="left:12px; top:72px; display:none;">
    <h4>Glide Planner v9</h4>

    <div class="field">Finesse: <input id="finesse" type="number" value="30"></div>
    <div class="field">Finesse basse: <input id="fb" type="number" value="10"></div>
    <div class="field">Seuil finesse basse (m): <input id="seuil" type="number" value="500"></div>
    <div class="field">Marge (m): <input id="marge" type="number" value="250"></div>
    <div class="field">Vitesse de croisière (km/h): <input id="vCruise" type="number" value="100"></div>

    <div class="field"><button id="btnRecalc" style="width:100%; padding:10px; border-radius:8px; border:none; background:#1f6feb; color:white; font-weight:700;">Recalculer</button></div>

    <hr>

    <div class="field">Hauteur: <span id="hVal">600</span> m</div>
    <div class="field"><input id="slider" type="range" min="0" max="3000" step="100" value="600"></div>

    <div class="field"><label><input type="checkbox" id="all"> Tous cercles 100m</label></div>
    <div class="field"><label><input type="checkbox" id="labels" checked> Labels</label></div>
    <div class="field"><label><input type="checkbox" id="showConn" checked> Afficher zones atteignables</label></div>

    <hr>

    <div class="field">Mode<br>
      <select id="mode">
        <option value="QFE">QFE (terrain)</option>
        <option value="QNH">QNH</option>
        <option value="QFE_REF">QFE référence</option>
      </select>
    </div>

    <div class="field">Terrain référence<br>
      <select id="refSelect"></select>
    </div>

    <hr>

    <div class="field">Distance filtre (km): <input id="rangeKm" type="number" value="100"></div>
  </div>

  <div id="menuVent" class="panel" style="left:352px; top:72px; display:none;">
    <h4>Vent</h4>
    <div class="field"><label><input type="checkbox" id="applyWind"> Prendre en compte le vent</label></div>
    <div id="windControls" style="margin-top:6px;"></div>
    <div class="field"><button id="btnRecalcWind" style="width:100%; padding:8px; border-radius:8px; border:none; background:#333; color:white;">Recalculer tout</button></div>
  </div>
</div>

<!-- MODE VOL -->
<div id="volScreen" class="screen">
  <button class="backBtn" id="backFromVol">← Menu</button>
  <h2 style="margin-top:60px;">Mode Vol</h2>
  <p>Carte interactive.</p>
</div>

<!-- MANUEL -->
<div id="manuelScreen" class="screen">
  <button class="backBtn" id="backFromManuel">← Menu</button>
  <h2>Manuel</h2>
  <p>Carte floutée ici.</p>
</div>
