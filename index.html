<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PlanneurMob V17 Fix</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html, body { margin:0; height:100%; }
#map { position:fixed; width:100%; height:100%; }
.panel {
  position:absolute; top:10px; left:10px; width:280px;
  background:rgba(240,240,240,0.95); padding:10px; border-radius:10px;
  font-family:sans-serif; z-index:1000; max-height:85vh; overflow:auto;
}
.toggleBtn {
  position:absolute; right:10px; z-index:1100; background:black; color:white; padding:8px; border-radius:8px;
}
.label {
  font-size:11px; font-weight:bold; background:rgba(255,255,255,0.8);
  padding:2px 4px; border-radius:4px;
}
</style>
</head>
<body>

<div id="map"></div>

<button class="toggleBtn" style="top:10px;" onclick="panel.style.display = panel.style.display==='none'?'block':'none'">⚙</button>
<button class="toggleBtn" style="top:60px;" onclick="toggleVent()">⚡</button>

<div id="panel" class="panel">
<b>Glide Planner V17 Fix</b><br><br>

Finesse: <input id="finesse" type="number" value="30"><br>
Finesse basse: <input id="fb" type="number" value="10"><br>
Seuil finesse basse: <input id="seuil" type="number" value="500"><br>
Marge: <input id="marge" type="number" value="250"><br>
Vitesse croisière / finesse max: <input id="vitesse" type="number" value="80"> km/h<br>
<button onclick="update()">Recalculer</button>
<hr>

Hauteur: <span id="hVal">600</span><br>
<input id="slider" type="range" min="0" max="3000" step="100" value="600" oninput="update()"><br>

<input type="checkbox" id="all" onchange="update()"> Tous cercles 100m<br>
<input type="checkbox" id="labels" checked onchange="update()"> Labels<br>
<input type="checkbox" id="showConn" checked onchange="update()"> Afficher zones atteignables<br>
<hr>

Mode:
<select id="mode" onchange="update()">
<option value="QFE">QFE (terrain)</option>
<option value="QNH">QNH</option>
<option value="QFE_REF">QFE référence</option>
</select><br>

Terrain référence:
<select id="refSelect" onchange="update()"></select><br>
<hr>

Distance filtre (km):
<input id="rangeKm" type="number" value="100" onchange="update()">
</div>

<div id="menuVent" class="panel" style="left:310px; display:none;">
<b>Vent</b><br><br>
<label><input type="checkbox" id="applyWind"> Prendre en compte le vent</label><hr>
<div id="windControls"></div>
</div>

<script>

// --- MAP ---
var map = L.map('map').setView([43.8,0.1],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// --- POSITION ---
let userPos = {lat:43.8, lon:0.1};
map.on('moveend', ()=>{
  let c = map.getCenter();
  userPos = {lat:c.lat, lon:c.lng};
  update();
});

// --- DISTANCE ---
function distanceKm(a,b){
  let R=6371;
  let dLat=(b.lat-a.lat)*Math.PI/180;
  let dLon=(b.lon-a.lon)*Math.PI/180;
  let x = Math.sin(dLat/2)**2 +
          Math.cos(a.lat*Math.PI/180) *
          Math.cos(b.lat*Math.PI/180) *
          Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// --- TERRAINS ---
let terrainsAll = [
  {id:"LFDA",lat:43.709,lon:-0.249,alt:80},
  {id:"LFID",lat:43.955,lon:0.373,alt:130},
  {id:"LFCN",lat:43.762,lon:-0.036,alt:100},
  {id:"LFDH",lat:43.646,lon:0.601,alt:130},
  {id:"LFBM",lat:43.911,lon:-0.507,alt:52},
  {id:"LFCL",lat:43.586,lon:1.499,alt:152}
];
let terrains=[];
function populateRef(){
  refSelect.innerHTML="";
  terrainsAll.forEach(t=>{
    let opt=document.createElement("option");
    opt.value=t.id; opt.innerText=t.id;
    refSelect.appendChild(opt);
  });
}
populateRef();

// --- COULEUR ---
function color(h){
  let r=Math.round(255*(1-(h/3000)));
  let g=Math.round(255*(h/3000));
  return "rgb("+r+","+g+",0)";
}

// --- TOGGLE VENT ---
function toggleVent(){
  let m = document.getElementById("menuVent");
  m.style.display = (m.style.display==='none')?'block':'none';
}

// --- WIND MENU ---
let windLayers = [
  {id:'0-500',v:'v0',d:'d0'},
  {id:'500-1000',v:'v1',d:'d1'},
  {id:'1000-1500',v:'v2',d:'d2'},
  {id:'1500-2000',v:'v3',d:'d3'},
  {id:'2000-2500',v:'v4',d:'d4'},
  {id:'2500-3000',v:'v5',d:'d5'}
];
function updateWindLabel(id){
  let slider = document.getElementById(id);
  let label = document.getElementById(id+'_label');
  label.innerText = slider.value+' km/h';
}
function initWindMenu(){
  let container = document.getElementById("windControls");
  windLayers.forEach((w,i)=>{
    let html = `<b>${w.id} m</b><br>
    <div style="display:flex;align-items:center;">
      <input type="range" id="${w.v}" min="0" max="50" value="0" oninput="updateWindLabel('${w.v}')">
      <span id="${w.v}_label" style="margin-left:8px;">0 km/h</span>
    </div>
    Direction: <input type="number" id="${w.d}" value="0" style="width:60px;"> °<hr>`;
    container.innerHTML += html;
    updateWindLabel(w.v);
  });
}
initWindMenu();

// --- OBJECTS ---
let objs=[];

// --- APPLY WIND REALISTE ---
function getWindAdjustedPoints(lat, lon, h, dMax, vCruise){
  if(!applyWind.checked) return null;

  let layerIdx = Math.floor(h/500);
  if(layerIdx>5) layerIdx=5;
  let v = parseFloat(document.getElementById(windLayers[layerIdx].v).value);
  let dir = parseFloat(document.getElementById(windLayers[layerIdx].d).value);

  if(v===0) return null;

  let points=[];
  let nb=72;
  for(let i=0;i<nb;i++){
    let angleRad = i*2*Math.PI/nb;
    let x = Math.cos(angleRad);
    let y = Math.sin(angleRad);
    let windRad = dir*Math.PI/180;
    let deltaV = v * Math.cos(Math.atan2(y,x)-windRad);
    let distAdj = dMax * (1 + deltaV/vCruise);
    let latOff = (distAdj/111000)*y;
    let lonOff = (distAdj/(111000*Math.cos(lat*Math.PI/180)))*x;
    points.push([lat+latOff, lon+lonOff]);
  }
  return points;
}

// --- UPDATE ---
function update(){
  objs.forEach(o=>map.removeLayer(o));
  objs=[];

  let range = parseFloat(rangeKm.value);
  terrains = terrainsAll.filter(t=>distanceKm(userPos,t)<=range);

  let h=parseInt(slider.value); hVal.innerText=h;
  let f=parseFloat(finesse.value);
  let fbVal=parseFloat(fb.value);
  let seuilVal=parseFloat(seuil.value);
  let margeVal=parseFloat(marge.value);
  let vCruise = parseFloat(vitesse.value);
  let modeVal=mode.value;
  let showLabels=labels.checked;
  let allVal=all.checked;

  let ref = terrainsAll.find(t => t.id === refSelect.value);
  let refAlt = ref?ref.alt:0;

  terrains.forEach(t=>{
    let hMin=allVal?0:h;
    let hMax=allVal?3000:h;

    for(let hh=hMin; hh<=hMax; hh+=100){
      let h_rel;
      if(modeVal==="QFE"){ h_rel = hh; }
      else if(modeVal==="QNH"){ h_rel = hh - t.alt; }
      else if(modeVal==="QFE_REF"){ h_rel = hh - (t.alt - refAlt); }

      if(h_rel<=0) continue;
      let finesseUse = (h_rel<=seuilVal)? fbVal : f;
      let h_util = h_rel - margeVal;
      if(h_util<=0) continue;

      let d = h_util*finesseUse;

      let points = getWindAdjustedPoints(t.lat,t.lon,hh,d,vCruise);
      if(points){
        objs.push(L.polygon(points,{color:color(hh),weight:2,fill:false}).addTo(map));
      } else {
        objs.push(L.circle([t.lat,t.lon],{radius:d,color:color(hh),weight:2,fill:false}).addTo(map));
      }

      if(showLabels && !points){
        [0,180].forEach(a=>{
          let rad=a*Math.PI/180;
          let latOff=(d/111000)*Math.cos(rad);
          let lonOff=(d/(111000*Math.cos(t.lat*Math.PI/180)))*Math.sin(rad);
          objs.push(L.marker([t.lat+latOff,t.lon+lonOff],{icon:L.divIcon({className:'label', html:hh+"m-F"+Math.round(finesseUse)+"-"+t.id})}).addTo(map));
        });
      }
    }
    objs.push(L.marker([t.lat,t.lon]).addTo(map));
  });
}
update();

// --- AJOUT TERRAIN ---
map.on('click', function(e){
  let nom=prompt("Nom terrain ?");
  if(!nom) return;
  let alt=parseFloat(prompt("Altitude m ?"));
  if(isNaN(alt)) return;
  terrainsAll.push({id:nom,lat:e.latlng.lat,lon:e.latlng.lng,alt:alt});
  populateRef(); update();
});

</script>
</body>
</html>
