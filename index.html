<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Glide Planner – Version Finale Stable</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body {
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:Inter, system-ui, sans-serif;
}

/* --- MAP --- */
#map {
  position:fixed;
  inset:0;
  z-index:1;
  transition:filter .25s ease;
  touch-action:pan-x pan-y pinch-zoom;
}

/* flou appliqué directement sur la carte */
.map-blurred {
  filter:blur(6px) brightness(.55);
  pointer-events:none;
}

/* --- SCREENS --- */
.screen {
  position:fixed;
  inset:0;
  display:none;
  z-index:10;
  color:white;
  text-align:center;
  padding-top:80px;
}

#homeScreen, #manuelScreen {
  backdrop-filter:blur(4px);
  background:rgba(0,0,0,0.35);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

button {
  padding:14px 20px;
  border-radius:10px;
  border:none;
  font-size:18px;
  cursor:pointer;
  margin:10px;
  background:white;
  color:black;
  font-weight:bold;
  z-index:20;
  position:relative;
}

/* PREPARATION PANELS */
.panel {
  position:absolute;
  width:320px;
  background:rgba(255,255,255,0.96);
  border-radius:12px;
  padding:12px;
  box-shadow:0 6px 18px rgba(0,0,0,0.18);
  z-index:2000;
  max-height:78vh;
  overflow:auto;
  border:1px solid rgba(20,20,20,0.04);
  touch-action:none;
}

.toggleBtn {
  position:absolute;
  right:12px;
  z-index:2100;
  background:#1f6feb;
  color:white;
  padding:10px;
  border-radius:10px;
  border:none;
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(31,111,235,0.18);
}

.toggleBtn.top { top:12px; }
.toggleBtn.second { top:72px; }

.backBtn {
  position:absolute;
  top:12px;
  left:12px;
  z-index:2200;
  background:rgba(0,0,0,0.7);
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,0.25);
}
</style>
</head>

<body>

<!-- MAP -->
<div id="map"></div>

<!-- HOME -->
<div id="homeScreen" class="screen">
  <h1>Glide Planner</h1>
  <button id="btnGoPrep">Préparation</button>
  <button id="btnGoVol">Mode Vol</button>
  <button id="btnGoManuel">Manuel</button>
</div>

<!-- PREPARATION -->
<div id="prepScreen" class="screen" style="color:black; text-shadow:none;">
  <button class="backBtn" id="backFromPrep">← Menu</button>

  <button id="btnPanel" class="toggleBtn top">⚙</button>
  <button id="btnVent" class="toggleBtn second">🌬</button>

  <div id="panel" class="panel" style="left:12px; top:72px; display:none;">
    <h4>Glide Planner v9</h4>

    <div class="field">Finesse: <input id="finesse" type="number" value="30"></div>
    <div class="field">Finesse basse: <input id="fb" type="number" value="10"></div>
    <div class="field">Seuil finesse basse (m): <input id="seuil" type="number" value="500"></div>
    <div class="field">Marge (m): <input id="marge" type="number" value="250"></div>
    <div class="field">Vitesse de croisière (km/h): <input id="vCruise" type="number" value="100"></div>

    <div class="field"><button id="btnRecalc" style="width:100%; padding:10px; border-radius:8px; border:none; background:#1f6feb; color:white; font-weight:700;">Recalculer</button></div>

    <hr>

    <div class="field">Hauteur: <span id="hVal">600</span> m</div>
    <div class="field"><input id="slider" type="range" min="0" max="3000" step="100" value="600"></div>

    <div class="field"><label><input type="checkbox" id="all"> Tous cercles 100m</label></div>
    <div class="field"><label><input type="checkbox" id="labels" checked> Labels</label></div>
    <div class="field"><label><input type="checkbox" id="showConn" checked> Afficher zones atteignables</label></div>

    <hr>

    <div class="field">Mode<br>
      <select id="mode">
        <option value="QFE">QFE (terrain)</option>
        <option value="QNH">QNH</option>
        <option value="QFE_REF">QFE référence</option>
      </select>
    </div>

    <div class="field">Terrain référence<br>
      <select id="refSelect"></select>
    </div>

    <hr>

    <div class="field">Distance filtre (km): <input id="rangeKm" type="number" value="100"></div>
  </div>

  <div id="menuVent" class="panel" style="left:352px; top:72px; display:none;">
    <h4>Vent</h4>
    <div class="field"><label><input type="checkbox" id="applyWind"> Prendre en compte le vent</label></div>
    <div id="windControls" style="margin-top:6px;"></div>
    <div class="field"><button id="btnRecalcWind" style="width:100%; padding:8px; border-radius:8px; border:none; background:#333; color:white;">Recalculer tout</button></div>
  </div>
</div>

<!-- MODE VOL -->
<div id="volScreen" class="screen">
  <button class="backBtn" id="backFromVol">← Menu</button>
  <h2 style="margin-top:60px;">Mode Vol</h2>
  <p>Carte interactive.</p>
</div>

<!-- MANUEL -->
<div id="manuelScreen" class="screen">
  <button class="backBtn" id="backFromManuel">← Menu</button>
  <h2>Manuel</h2>
  <p>Carte floutée ici.</p>
</div>
