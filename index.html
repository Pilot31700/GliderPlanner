<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PlanneurMob V19 - Zones atteignables réalistes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin:0; height:100%; }
#map { position:fixed; width:100%; height:100%; }
.panel {
  position:absolute; top:10px; left:10px;
  width:320px; background:rgba(240,240,240,0.95);
  padding:10px; border-radius:10px;
  font-family:sans-serif; z-index:1000;
  max-height:85vh; overflow:auto;
}
.toggleBtn {
  position:absolute; right:10px; z-index:1100;
  background:black; color:white; padding:8px; border-radius:8px;
}
.label {
  font-size:11px; font-weight:bold;
  background:rgba(255,255,255,0.8);
  padding:2px 4px; border-radius:4px;
}
</style>
</head>
<body>

<div id="map"></div>

<button class="toggleBtn" style="top:10px;" onclick="panel.style.display = panel.style.display==='none'?'block':'none'">⚙</button>
<button class="toggleBtn" style="top:60px;" onclick="toggleVent()">⚡</button>

<div id="panel" class="panel">
<b>Glide Planner V19</b><br><br>

Finesse: <input id="finesse" type="number" value="30"><br>
Finesse basse: <input id="fb" type="number" value="10"><br>
Seuil finesse basse: <input id="seuil" type="number" value="500"><br>
Marge: <input id="marge" type="number" value="250"><br>
Vitesse croisière: <input id="vCruise" type="number" value="100"> km/h<br>
<button onclick="update()">Recalculer</button>
<hr>

Hauteur: <span id="hVal">600</span><br>
<input id="slider" type="range" min="400" max="3000" step="100" value="600" oninput="update()"><br>

<input type="checkbox" id="all" onchange="update()"> Tous cercles 100m<br>
<input type="checkbox" id="labels" checked onchange="update()"> Labels<br>
<input type="checkbox" id="showConn" checked onchange="update()"> Afficher zones atteignables<br>
<hr>

Mode:
<select id="mode" onchange="update()">
<option value="QFE">QFE (terrain)</option>
<option value="QNH">QNH</option>
<option value="QFE_REF">QFE référence</option>
</select><br>

Terrain référence:
<select id="refSelect" onchange="update()"></select><br>
<hr>

Distance filtre (km):
<input id="rangeKm" type="number" value="100" onchange="update()">
</div>

<div id="menuVent" class="panel" style="left:340px; display:none;">
<b>Vent</b><br><br>
<label><input type="checkbox" id="applyWind" onchange="update()"> Prendre en compte le vent</label>
<hr>

<script>
const windLayers = [
  {label:"0-500", v:"v0", d:"d0"},
  {label:"500-1000", v:"v1", d:"d1"},
  {label:"1000-1500", v:"v2", d:"d2"},
  {label:"1500-2000", v:"v3", d:"d3"},
  {label:"2000-2500", v:"v4", d:"d4"},
  {label:"2500-3000", v:"v5", d:"d5"}
];

windLayers.forEach((w)=>{
  document.write(`<b>${w.label} m</b><br>
  <div style="display:flex;align-items:center;">
  <input type="range" id="${w.v}" min="0" max="50" value="0" oninput="updateWindLabel('${w.v}')">
  <span id="${w.v}_label" style="margin-left:8px;">0 km/h</span>
  </div>
  Direction: <input type="number" id="${w.d}" value="0" style="width:60px;"> °<hr>`);
});
document.write('<button onclick="update()" style="width:100%">Recalculer tout</button>');

function toggleVent(){
  let m = document.getElementById("menuVent");
  m.style.display = (m.style.display === "none") ? "block" : "none";
}

function updateWindLabel(id){
  document.getElementById(id+"_label").innerText=document.getElementById(id).value+" km/h";
}
["v0","v1","v2","v3","v4","v5"].forEach(updateWindLabel);
</script>

<script>
var map = L.map('map').setView([43.8,0.1],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let userPos={lat:43.8, lon:0.1};
map.on('moveend', ()=>{ userPos=map.getCenter(); update(); });

function distanceKm(a,b){
  let R=6371;
  let dLat=(b.lat-a.lat)*Math.PI/180;
  let dLon=(b.lon-a.lon)*Math.PI/180;
  let x=Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

let terrainsAll=[
  {id:"LFDA",lat:43.709,lon:-0.249,alt:80},
  {id:"LFID",lat:43.955,lon:0.373,alt:130},
  {id:"LFCN",lat:43.762,lon:-0.036,alt:100},
  {id:"LFDH",lat:43.646,lon:0.601,alt:130},
  {id:"LFBM",lat:43.911,lon:-0.507,alt:52},
  {id:"LFCL",lat:43.586,lon:1.499,alt:152}
];
let terrains=[];
function populateRef(){
  refSelect.innerHTML="";
  terrainsAll.forEach(t=>{
    let opt=document.createElement("option");
    opt.value=t.id; opt.innerText=t.id; refSelect.appendChild(opt);
  });
}
populateRef();

function color(h){
  let r=Math.round(255*(1-(h-400)/2600));
  let g=Math.round(255*((h-400)/2600));
  return "rgb("+r+","+g+",0)";
}

let objs=[];
function update(){
  objs.forEach(o=>map.removeLayer(o));
  objs=[];

  let range=parseFloat(rangeKm.value);
  terrains=terrainsAll.filter(t=>distanceKm(userPos,t)<=range);

  let h=parseInt(slider.value); hVal.innerText=h;

  let f=parseFloat(finesse.value);
  let fbVal=parseFloat(fb.value);
  let seuilVal=parseFloat(seuil.value);
  let margeVal=parseFloat(marge.value);
  let modeVal=mode.value;
  let showLabels=labels.checked;
  let allVal=all.checked;
  let showConn=document.getElementById("showConn").checked;
  let applyWind=document.getElementById("applyWind").checked;
  let vCruise=parseFloat(document.getElementById("vCruise").value);

  let ref=terrainsAll.find(t=>t.id===refSelect.value);
  let refAlt=ref?ref.alt:0;

  terrains.forEach(t=>{
    let hMin=allVal?400:h; let hMax=allVal?3000:h;

    for(let hh=hMin; hh<=hMax; hh+=100){
      let h_rel;
      if(modeVal==="QFE") h_rel=hh;
      else if(modeVal==="QNH") h_rel=hh-t.alt;
      else h_rel=hh-(t.alt-refAlt);
      if(h_rel<=0) continue;
      let finesseUse=(h_rel<=seuilVal)? fbVal:f;
      let h_util=h_rel-margeVal;
      if(h_util<=0) continue;
      let d=h_util*finesseUse;

      if(!applyWind){
        let circle=L.circle([t.lat,t.lon],{radius:d,color:color(hh),weight:2,fill:false}).addTo(map);
        objs.push(circle);
        if(showLabels){
          [0,180].forEach(a=>{
            let rad=a*Math.PI/180;
            let latOff=(d/111000)*Math.cos(rad);
            let lonOff=(d/(111000*Math.cos(t.lat*Math.PI/180)))*Math.sin(rad);
            let lab=L.marker([t.lat+latOff,t.lon+lonOff],{icon:L.divIcon({className:'label',html:hh+"m-F"+Math.round(finesseUse)+"-"+t.id})}).addTo(map);
            objs.push(lab);
          });
        }
      } else {
        let points=[];
        for(let a=0;a<360;a+=5){
          let rad=a*Math.PI/180;
          let dx=d*Math.cos(rad), dy=d*Math.sin(rad);

          let altPoint=hh;
          let layerIdx=Math.floor(altPoint/500); if(layerIdx>5) layerIdx=5;
          let v=parseFloat(document.getElementById("v"+layerIdx).value);
          let dir=parseFloat(document.getElementById("d"+layerIdx).value);
          let dirRad=(dir)*Math.PI/180;

          // projection vent pour ce point
          let vx=v*Math.sin(dirRad)/vCruise*d;
          let vy=v*Math.cos(dirRad)/vCruise*d;

          points.push([t.lat+((dy-vy)/111000), t.lon+((dx-vx)/(111000*Math.cos(t.lat*Math.PI/180)))]);
        }
        let poly=L.polygon(points,{color:color(hh),weight:2,fill:false}).addTo(map);
        objs.push(poly);

        if(showLabels){
          [0,180].forEach(a=>{
            let rad=a*Math.PI/180;
            let latOff=(d/111000)*Math.cos(rad);
            let lonOff=(d/(111000*Math.cos(t.lat*Math.PI/180)))*Math.sin(rad);
            let lab=L.marker([t.lat+latOff,t.lon+lonOff],{icon:L.divIcon({className:'label',html:hh+"m-F"+Math.round(finesseUse)+"-"+t.id})}).addTo(map);
            objs.push(lab);
          });
        }
      }
    }
    let m=L.marker([t.lat,t.lon]).addTo(map); objs.push(m);
  });
}

update();

// ajout terrain
map.on('click', function(e){
  let nom=prompt("Nom terrain ?");
  if(!nom) return;
  let alt=parseFloat(prompt("Altitude m ?"));
  if(isNaN(alt)) return;
  terrainsAll.push({id:nom,lat:e.latlng.lat,lon:e.latlng.lng,alt:alt});
  populateRef();
  update();
});
</script>

</body>
</html>
