<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PlanneurMob V15 propre</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin:0; height:100%; }
#map { position:fixed; width:100%; height:100%; }

.panel {
  position:absolute;
  top:10px;
  left:10px;
  width:280px;
  background:rgba(240,240,240,0.95);
  padding:10px;
  border-radius:10px;
  font-family:sans-serif;
  z-index:1000;
  max-height:85vh;
  overflow:auto;
}

.toggleBtn {
  position:absolute;
  right:10px;
  z-index:1100;
  background:black;
  color:white;
  padding:8px;
  border-radius:8px;
}

.label {
  font-size:11px;
  font-weight:bold;
  background:rgba(255,255,255,0.8);
  padding:2px 4px;
  border-radius:4px;
}
</style>
</head>

<body>

<div id="map"></div>

<button class="toggleBtn" style="top:10px;" onclick="panel.style.display = panel.style.display==='none'?'block':'none'">⚙</button>
<button class="toggleBtn" style="top:60px;" onclick="toggleVent()">⚡</button>

<div id="panel" class="panel">

Finesse: <input id="finesse" type="number" value="30"><br>
Finesse basse: <input id="fb" type="number" value="10"><br>
Seuil: <input id="seuil" type="number" value="500"><br>
Marge: <input id="marge" type="number" value="250"><br>

Hauteur: <span id="hVal">600</span><br>
<input id="slider" type="range" min="400" max="1500" step="100" value="600" oninput="update()">

</div>

<div id="menuVent" class="panel" style="left:310px; display:none;">
<input type="checkbox" id="applyWind"> Vent ON<br>

Vitesse: <input type="range" id="v0" min="0" max="50" value="0">
Direction: <input type="number" id="d0" value="0"> °
</div>

<script>

function toggleVent(){
  menuVent.style.display = menuVent.style.display==="none"?"block":"none";
}

var map = L.map('map').setView([43.8,0.1],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let terrains = [
  {id:"LFDA",lat:43.709,lon:-0.249,alt:80}
];

let objs=[];

function update(){

  objs.forEach(o=>map.removeLayer(o));
  objs=[];

  let h=parseInt(slider.value);
  hVal.innerText=h;

  let f=parseFloat(finesse.value);
  let margeVal=parseFloat(marge.value);

  let useWind = applyWind.checked;
  let windSpeed = parseFloat(v0.value);
  let windDir = parseFloat(d0.value);

  terrains.forEach(t=>{

    let h_util = h - margeVal;
    if(h_util<=0) return;

    let baseDist = h_util * f;

    let pts=[];

    for(let a=0;a<360;a+=5){

      let rad=a*Math.PI/180;
      let dist = baseDist;

      if(useWind){
        let windRad=windDir*Math.PI/180;
        let proj=Math.cos(windRad-rad);
        dist += windSpeed * proj * 40;
      }

      let latOff=(dist/111000)*Math.cos(rad);
      let lonOff=(dist/(111000*Math.cos(t.lat*Math.PI/180)))*Math.sin(rad);

      pts.push([t.lat+latOff, t.lon+lonOff]);
    }

    let poly=L.polygon(pts,{
      color:"green",
      weight:2,
      fill:false
    }).addTo(map);

    objs.push(poly);

    L.marker([t.lat,t.lon]).addTo(map);
  });
}

update();

</script>

</body>
</html>
