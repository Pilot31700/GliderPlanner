<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planneur V15</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  body, html { margin:0; padding:0; height:100%; font-family:Arial,sans-serif;}
  #map { height:100%; width:100%; }
  .menu { position:absolute; top:10px; left:10px; background:white; padding:10px; border-radius:6px; z-index:1000; max-height:90%; overflow:auto; box-shadow:0 0 10px rgba(0,0,0,0.3);}
  .menu h3 { margin:5px 0; }
  .menu label { display:block; margin:3px 0; }
  .slider-label { display:flex; justify-content:space-between; }
  button { margin:3px 0; padding:3px 6px; }
</style>
</head>
<body>
<div id="map"></div>

<div class="menu" id="menuParam">
  <h3>Paramètres</h3>
  <label><input type="checkbox" id="showLabels" checked> Afficher labels</label>
  <label>Mode altimétrique:
    <select id="modeAlt">
      <option value="QFE">QFE terrain départ</option>
      <option value="QNH">QNH</option>
      <option value="QFE_REF">QFE terrain référence</option>
    </select>
  </label>
  <label>Finesse standard: <input type="number" id="finesse" value="10" min="1"></label>
  <label>Seuil finesse basse (m): <input type="number" id="seuilFinesse" value="500"></label>
  <label>Marge sécurité (m): <input type="number" id="marge" value="250"></label>
  <label><input type="checkbox" id="showZones"> Afficher zones atteignables</label>
  <label><input type="checkbox" id="showAllCircles"> Tout afficher (100m)</label>
</div>

<div class="menu" id="menuVent" style="top:10px; left:250px;">
  <h3>Vent</h3>
  <label><input type="checkbox" id="applyWind"> Prendre en compte le vent</label>
  <div id="windControls">
    <div>
      <strong>Tranche 0–500 m</strong>
      <div class="slider-label"><span>Vitesse (km/h)</span><span id="v0_500_val">0</span></div>
      <input type="range" id="v0_500" min="0" max="50" value="0">
      <label>Direction (°) <input type="number" id="d0_500" value="0" min="0" max="359"></label>
    </div>
    <div>
      <strong>Tranche 500–1000 m</strong>
      <div class="slider-label"><span>Vitesse (km/h)</span><span id="v500_1000_val">0</span></div>
      <input type="range" id="v500_1000" min="0" max="50" value="0">
      <label>Direction (°) <input type="number" id="d500_1000" value="0" min="0" max="359"></label>
    </div>
    <div>
      <strong>Tranche 1000–1500 m</strong>
      <div class="slider-label"><span>Vitesse (km/h)</span><span id="v1000_1500_val">0</span></div>
      <input type="range" id="v1000_1500" min="0" max="50" value="0">
      <label>Direction (°) <input type="number" id="d1000_1500" value="0" min="0" max="359"></label>
    </div>
    <div>
      <strong>Tranche 1500–2000 m</strong>
      <div class="slider-label"><span>Vitesse (km/h)</span><span id="v1500_2000_val">0</span></div>
      <input type="range" id="v1500_2000" min="0" max="50" value="0">
      <label>Direction (°) <input type="number" id="d1500_2000" value="0" min="0" max="359"></label>
    </div>
    <div>
      <strong>Tranche 2000–2500 m</strong>
      <div class="slider-label"><span>Vitesse (km/h)</span><span id="v2000_2500_val">0</span></div>
      <input type="range" id="v2000_2500" min="0" max="50" value="0">
      <label>Direction (°) <input type="number" id="d2000_2500" value="0" min="0" max="359"></label>
    </div>
    <div>
      <strong>Tranche 2500–3000 m</strong>
      <div class="slider-label"><span>Vitesse (km/h)</span><span id="v2500_3000_val">0</span></div>
      <input type="range" id="v2500_3000" min="0" max="50" value="0">
      <label>Direction (°) <input type="number" id="d2500_3000" value="0" min="0" max="359"></label>
    </div>
    <button id="applyWindBtn">Appliquer le vent</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ------------------ Carte ------------------
const map = L.map('map').setView([43.5,0], 7); // France
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18
}).addTo(map);

// ------------------ Terrains init ------------------
let terrains = [
  {code:"LFDA", nom:"Aire-sur-l'Adour", lat:43.7086, lng:-0.0564, alt:136},
  {code:"LFID", nom:"Condom", lat:43.960, lng:0.295, alt:146},
  {code:"LFCN", nom:"Cazères", lat:43.25, lng:1.27, alt:180},
  {code:"LFDH", nom:"Auch", lat:43.647, lng:0.587, alt:160}
];

let refTerrain = "LFDA";

// ------------------ Paramètres ------------------
let finesse = 10;
let seuilFinesse = 500;
let marge = 250;
let modeAlt = "QFE";
let showLabels = true;
let showZones = true;
let showAllCircles = false;

// ------------------ Vent ------------------
let applyWind = false;
let windTranches = [
  {min:0,max:500,v:0,d:0},
  {min:500,max:1000,v:0,d:0},
  {min:1000,max:1500,v:0,d:0},
  {min:1500,max:2000,v:0,d:0},
  {min:2000,max:2500,v:0,d:0},
  {min:2500,max:3000,v:0,d:0},
];

// ------------------ Cercles ------------------
let circleLayers = [];

// ------------------ Fonctions ------------------
function hauteurTerrain(terrain) {
  if(modeAlt=="QFE") return 0;
  if(modeAlt=="QNH") return terrain.alt;
  if(modeAlt=="QFE_REF") {
    let ref = terrains.find(t=>t.code===refTerrain);
    return terrain.alt - ref.alt;
  }
  return 0;
}

function calcDistance(r, angle, tranche) {
  // Vent effect
  if(!applyWind) return r;
  let theta = angle*Math.PI/180;
  let windTheta = windTranches[tranche].d*Math.PI/180;
  let vx = Math.cos(windTheta - theta) * windTranches[tranche].v;
  return r + vx; // simple approx km/h -> km à adapter
}

function drawCircles() {
  // clear previous
  circleLayers.forEach(c=>map.removeLayer(c));
  circleLayers=[];
  
  terrains.forEach((terrain)=>{
    let baseAlt = hauteurTerrain(terrain);
    let maxAlt = showAllCircles ? 3000 : 1000;
    let step = showAllCircles ? 100 : 500;
    for(let h=step; h<=maxAlt; h+=step){
      let effectiveH = h - marge;
      let radius = finesse * effectiveH / 1000; // en km
      // Déformation
      let points = [];
      for(let angle=0; angle<360; angle+=10){
        let r = calcDistance(radius, angle, Math.floor(h/500));
        let lat = terrain.lat + (r/111) * Math.cos(angle*Math.PI/180);
        let lng = terrain.lng + (r/(111*Math.cos(terrain.lat*Math.PI/180))) * Math.sin(angle*Math.PI/180);
        points.push([lat,lng]);
      }
      let color = `hsl(${120*(h/3000)},100%,50%)`;
      let poly = L.polygon(points, {color:color, fill:false, weight:2}).addTo(map);
      circleLayers.push(poly);
      // Label
      if(showLabels && angle%2==0){
        let mid = points[Math.floor(points.length/4)];
        L.marker(mid,{icon:L.divIcon({className:'label', html:`${h}m-${terrain.code}`, iconSize:[0,0]})}).addTo(map);
      }
    }
  });
}

// ------------------ Event listeners ------------------
document.getElementById("finesse").addEventListener("change", (e)=>{
  finesse=parseFloat(e.target.value); drawCircles();
});
document.getElementById("seuilFinesse").addEventListener("change", (e)=>{seuilFinesse=parseFloat(e.target.value); drawCircles();});
document.getElementById("marge").addEventListener("change", (e)=>{marge=parseFloat(e.target.value); drawCircles();});
document.getElementById("modeAlt").addEventListener("change",(e)=>{modeAlt=e.target.value; drawCircles();});
document.getElementById("showLabels").addEventListener("change",(e)=>{showLabels=e.target.checked; drawCircles();});
document.getElementById("showZones").addEventListener("change",(e)=>{showZones=e.target.checked; drawCircles();});
document.getElementById("showAllCircles").addEventListener("change",(e)=>{showAllCircles=e.target.checked; drawCircles();});

// Vent sliders
["v0_500","v500_1000","v1000_1500","v1500_2000","v2000_2500","v2500_3000"].forEach((id,i)=>{
  document.getElementById(id).addEventListener("input",(e)=>{
    windTranches[i].v=parseFloat(e.target.value);
    document.getElementById(id+"_val").innerText=e.target.value;
  });
});
["d0_500","d500_1000","d1000_1500","d1500_2000","d2000_2500","d2500_3000"].forEach((id,i)=>{
  document.getElementById(id).addEventListener("change",(e)=>{
    windTranches[i].d=parseFloat(e.target.value);
  });
});

document.getElementById("applyWindBtn").addEventListener("click",()=>{applyWind=document.getElementById("applyWind").checked; drawCircles();});

// Initial draw
drawCircles();

</script>
</body>
</html>
