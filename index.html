<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PlanneurMob V15 - Vent stable</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin:0; height:100%; }
#map { position:fixed; width:100%; height:100%; }

.panel {
  position:absolute;
  top:10px;
  left:10px;
  width:280px;
  background:rgba(240,240,240,0.95);
  padding:10px;
  border-radius:10px;
  font-family:sans-serif;
  z-index:1000;
  max-height:85vh;
  overflow:auto;
}

.toggleBtn {
  position:absolute;
  right:10px;
  z-index:1100;
  background:black;
  color:white;
  padding:8px;
  border-radius:8px;
}

.label {
  font-size:11px;
  font-weight:bold;
  background:rgba(255,255,255,0.8);
  padding:2px 4px;
  border-radius:4px;
}
</style>
</head>
<body>

<div id="map"></div>

<button class="toggleBtn" style="top:10px;" onclick="panel.style.display = panel.style.display==='none'?'block':'none'">⚙</button>
<button class="toggleBtn" style="top:60px;" onclick="toggleVent()">⚡</button>

<div id="panel" class="panel">

<b>Glide Planner V15</b><br><br>

Finesse: <input id="finesse" type="number" value="30"><br>
Finesse basse: <input id="fb" type="number" value="10"><br>
Seuil finesse basse: <input id="seuil" type="number" value="500"><br>
Marge: <input id="marge" type="number" value="250"><br>
<button onclick="update()">Recalculer</button>
<hr>

Hauteur: <span id="hVal">600</span><br>
<input id="slider" type="range" min="400" max="1500" step="100" value="600" oninput="update()"><br>

<input type="checkbox" id="all" onchange="update()"> Tous cercles 100m<br>
<input type="checkbox" id="labels" checked onchange="update()"> Labels<br>
<input type="checkbox" id="showConn" checked onchange="update()"> Afficher zones atteignables<br>
<hr>

Mode:
<select id="mode" onchange="update()">
<option value="QFE">QFE (terrain)</option>
<option value="QNH">QNH</option>
<option value="QFE_REF">QFE référence</option>
</select><br>

Terrain référence:
<select id="refSelect" onchange="update()"></select><br>
<hr>

Distance filtre (km):
<input id="rangeKm" type="number" value="100" onchange="update()">

</div>

<!-- MENU VENT -->
<div id="menuVent" class="panel" style="left:310px; display:none;">

<b>Vent</b><br><br>

<label>
<input type="checkbox" id="applyWind" onchange="update()"> Prendre en compte le vent
</label>

<hr>

<b>0 - 500 m</b><br>
<input type="range" id="v0" min="0" max="50" value="0" oninput="updateWindLabel('v0')">
<span id="v0_label">0 km/h</span><br>
Direction: <input type="number" id="d0" value="0"> °

<hr>

<b>500 - 1000 m</b><br>
<input type="range" id="v1" min="0" max="50" value="0" oninput="updateWindLabel('v1')">
<span id="v1_label">0 km/h</span><br>
Direction: <input type="number" id="d1" value="0"> °

</div>

<script>

// toggle vent
function toggleVent(){
  menuVent.style.display = menuVent.style.display==="none"?"block":"none";
}

// slider label
function updateWindLabel(id){
  let v=document.getElementById(id).value;
  document.getElementById(id+"_label").innerText=v+" km/h";
}
["v0","v1"].forEach(updateWindLabel);

// map
var map = L.map('map').setView([43.8,0.1],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// position
let userPos = {lat:43.8, lon:0.1};
map.on('moveend', ()=>{
  let c = map.getCenter();
  userPos = {lat:c.lat, lon:c.lng};
  update();
});

// distance
function distanceKm(a,b){
  let R=6371;
  let dLat=(b.lat-a.lat)*Math.PI/180;
  let dLon=(b.lon-a.lon)*Math.PI/180;
  let x = Math.sin(dLat/2)**2 +
          Math.cos(a.lat*Math.PI/180) *
          Math.cos(b.lat*Math.PI/180) *
          Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// terrains
let terrainsAll = [
  {id:"LFDA",lat:43.709,lon:-0.249,alt:80},
  {id:"LFID",lat:43.955,lon:0.373,alt:130}
];

let terrains=[];

// select ref
function populateRef(){
  refSelect.innerHTML="";
  terrainsAll.forEach(t=>{
    let opt=document.createElement("option");
    opt.value=t.id;
    opt.innerText=t.id;
    refSelect.appendChild(opt);
  });
}
populateRef();

// couleur
function color(h){
  let r=Math.round(255*(1-(h-400)/1100));
  let g=Math.round(255*((h-400)/1100));
  return "rgb("+r+","+g+",0)";
}

// draw
let objs=[];

function update(){

  objs.forEach(o=>map.removeLayer(o));
  objs=[];

  let range = parseFloat(rangeKm.value);
  terrains = terrainsAll.filter(t=>distanceKm(userPos,t)<=range);

  let h=parseInt(slider.value);
  hVal.innerText=h;

  let f=parseFloat(finesse.value);
  let fbVal=parseFloat(fb.value);
  let seuilVal=parseFloat(seuil.value);
  let margeVal=parseFloat(marge.value);
  let modeVal=mode.value;

  let useWind=applyWind.checked;
  let windSpeed=parseFloat(v0.value);

  terrains.forEach(t=>{

    let h_rel = (modeVal==="QNH") ? h - t.alt : h;
    if(h_rel<=0) return;

    let finesseUse=(h_rel<=seuilVal)?fbVal:f;
    let h_util=h_rel-margeVal;
    if(h_util<=0) return;

    let d=h_util*finesseUse;

    if(useWind){
      d += windSpeed * 30;
    }

    let circle=L.circle([t.lat,t.lon],{
      radius:d,
      color:color(h),
      weight:2,
      fill:false
    }).addTo(map);

    objs.push(circle);

    let m=L.marker([t.lat,t.lon]).addTo(map);
    objs.push(m);
  });
}

update();

</script>
</body>
</html>
