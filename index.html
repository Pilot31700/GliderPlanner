<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PlanneurMob V15 - Vent réel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin:0; height:100%; }
#map { position:fixed; width:100%; height:100%; }

.panel {
  position:absolute;
  top:10px;
  left:10px;
  width:280px;
  background:rgba(240,240,240,0.95);
  padding:10px;
  border-radius:10px;
  font-family:sans-serif;
  z-index:1000;
  max-height:85vh;
  overflow:auto;
}

.toggleBtn {
  position:absolute;
  right:10px;
  z-index:1100;
  background:black;
  color:white;
  padding:8px;
  border-radius:8px;
}

.label {
  font-size:11px;
  font-weight:bold;
  background:rgba(255,255,255,0.8);
  padding:2px 4px;
  border-radius:4px;
}
</style>
</head>
<body>

<div id="map"></div>

<button class="toggleBtn" style="top:10px;" onclick="panel.style.display = panel.style.display==='none'?'block':'none'">⚙</button>
<button class="toggleBtn" style="top:60px;" onclick="toggleVent()">⚡</button>

<div id="panel" class="panel">

<b>Glide Planner V15</b><br><br>

Finesse: <input id="finesse" type="number" value="30"><br>
Finesse basse: <input id="fb" type="number" value="10"><br>
Seuil finesse basse: <input id="seuil" type="number" value="500"><br>
Marge: <input id="marge" type="number" value="250"><br>

<hr>

Hauteur: <span id="hVal">600</span><br>
<input id="slider" type="range" min="400" max="1500" step="100" value="600" oninput="update()"><br>

<input type="checkbox" id="all" onchange="update()"> Tous cercles<br>
<input type="checkbox" id="labels" checked onchange="update()"> Labels<br>

<hr>

Mode:
<select id="mode" onchange="update()">
<option value="QFE">QFE</option>
<option value="QNH">QNH</option>
<option value="QFE_REF">QFE REF</option>
</select>

</div>

<div id="menuVent" class="panel" style="left:310px; display:none;">

<b>Vent</b><br><br>

<label>
<input type="checkbox" id="applyWind"> Activer vent
</label>

<hr>

Vitesse:
<input type="range" id="windSpeed" min="0" max="50" value="0" oninput="updateWindLabel()">
<span id="windVal">0 km/h</span><br>

Direction:
<input type="number" id="windDir" value="0"> °

</div>

<script>

function toggleVent(){
  let m = document.getElementById("menuVent");
  m.style.display = (m.style.display === "none") ? "block" : "none";
}

function updateWindLabel(){
  windVal.innerText = windSpeed.value + " km/h";
}

updateWindLabel();

// --- MAP ---
var map = L.map('map').setView([43.8,0.1],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// --- BASE ---
let terrains = [
  {id:"LFDA",lat:43.709,lon:-0.249,alt:80}
];

let objs=[];

function color(h){
  let r=Math.round(255*(1-(h-400)/1100));
  let g=Math.round(255*((h-400)/1100));
  return "rgb("+r+","+g+",0)";
}

function update(){

  objs.forEach(o=>map.removeLayer(o));
  objs=[];

  let h=parseInt(slider.value);
  hVal.innerText=h;

  let f=parseFloat(finesse.value);
  let fbVal=parseFloat(fb.value);
  let seuilVal=parseFloat(seuil.value);
  let margeVal=parseFloat(marge.value);

  let applyWindVal = applyWind.checked;
  let windSpd = parseFloat(windSpeed.value);
  let windDirDeg = parseFloat(windDir.value);

  terrains.forEach(t=>{

    let h_rel = h;
    let h_util = h_rel - margeVal;
    if(h_util <=0) return;

    let finesseUse = (h_rel <= seuilVal) ? fbVal : f;
    let baseDist = h_util * finesseUse;

    let points = [];

    for(let angle=0; angle<360; angle+=10){

      let rad = angle*Math.PI/180;

      let dist = baseDist;

      if(applyWindVal){

        let windRad = windDirDeg*Math.PI/180;
        let proj = Math.cos(windRad - rad);

        dist += windSpd * proj * 50; // facteur ajusté visuellement
      }

      let latOff = (dist/111000)*Math.cos(rad);
      let lonOff = (dist/(111000*Math.cos(t.lat*Math.PI/180)))*Math.sin(rad);

      points.push([t.lat+latOff, t.lon+lonOff]);
    }

    let poly = L.polygon(points,{
      color: color(h),
      weight:2,
      fill:false
    }).addTo(map);

    objs.push(poly);

    let m=L.marker([t.lat,t.lon]).addTo(map);
    objs.push(m);
  });
}

update();

// ajout terrain
map.on('click', function(e){
  let nom=prompt("Nom ?");
  let alt=parseFloat(prompt("Altitude ?"));
  if(!nom || isNaN(alt)) return;

  terrains.push({id:nom,lat:e.latlng.lat,lon:e.latlng.lng,alt:alt});
  update();
});

</script>

</body>
</html>
