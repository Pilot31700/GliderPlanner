<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Glide Planner Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin:0; height:100%; }
#map { position:fixed; width:100%; height:100%; }

.panel {
  position:absolute;
  top:10px;
  left:10px;
  width:260px;
  background:rgba(240,240,240,0.95);
  padding:10px;
  border-radius:10px;
  font-family:sans-serif;
  z-index:1000;
  max-height:85vh;
  overflow:auto;
}

.toggleBtn {
  position:absolute;
  top:10px;
  right:10px;
  z-index:1100;
  background:black;
  color:white;
  padding:8px;
  border-radius:8px;
}

.label {
  font-size:11px;
  font-weight:bold;
  background:rgba(255,255,255,0.8);
  padding:2px 4px;
  border-radius:4px;
}
</style>
</head>

<body>

<div id="map"></div>

<button class="toggleBtn" onclick="panel.style.display = panel.style.display==='none'?'block':'none'">⚙</button>

<div id="panel" class="panel">

<b>Glide Planner</b><br><br>

Finesse:
<input id="finesse" type="number" value="30">

Finesse basse:
<input id="fb" type="number" value="10">

Seuil finesse basse:
<input id="seuil" type="number" value="500">

Marge:
<input id="marge" type="number" value="250">

<button onclick="update()">Recalculer</button>

<hr>

Hauteur: <span id="hVal">600</span>
<input id="slider" type="range" min="400" max="1500" step="100" value="600" oninput="update()">

<input type="checkbox" id="all" onchange="update()"> Tous cercles<br>
<input type="checkbox" id="labels" checked onchange="update()"> Labels

<hr>

Distance filtre (km):
<input id="rangeKm" type="number" value="100" onchange="update()">

<hr>

Mode:
<select id="mode" onchange="update()">
<option value="QFE">QFE</option>
<option value="QNH">QNH</option>
</select>

</div>

<script>

// --- MAP ---
var map = L.map('map').setView([43.8,0.1],9);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// --- POSITION ---
let userPos = {lat:43.8, lon:0.1};

map.on('moveend', ()=>{
  let c = map.getCenter();
  userPos = {lat:c.lat, lon:c.lng};
  update();
});

// --- DISTANCE ---
function distanceKm(a,b){
  let R=6371;
  let dLat=(b.lat-a.lat)*Math.PI/180;
  let dLon=(b.lon-a.lon)*Math.PI/180;

  let x = Math.sin(dLat/2)**2 +
          Math.cos(a.lat*Math.PI/180) *
          Math.cos(b.lat*Math.PI/180) *
          Math.sin(dLon/2)**2;

  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// --- DATA ---
let terrains=[];
let terrainsAll=[];

// charger base
async function loadTerrains(){
  let res = await fetch("terrains.json");
  terrainsAll = await res.json();
  update();
}
loadTerrains();

// --- COULEUR ---
function color(h){
  let r=Math.round(255*(1-(h-400)/1100));
  let g=Math.round(255*((h-400)/1100));
  return "rgb("+r+","+g+",0)";
}

// --- DRAW ---
let objs=[];

function update(){

  objs.forEach(o=>map.removeLayer(o));
  objs=[];

  let range = parseFloat(rangeKm.value);

  // filtre distance
  terrains = terrainsAll.filter(t=>{
    return distanceKm(userPos, t) <= range;
  });

  let h=parseInt(slider.value);
  hVal.innerText=h;

  let f=parseFloat(finesse.value);
  let fbVal=parseFloat(fb.value);
  let seuilVal=parseFloat(seuil.value);
  let margeVal=parseFloat(marge.value);
  let modeVal=mode.value;
  let allVal=all.checked;
  let showLabels=labels.checked;

  terrains.forEach(t=>{

    let hMin=allVal?400:h;
    let hMax=allVal?1500:h;

    for(let hh=hMin;hh<=hMax;hh+=100){

      let h_rel = (modeVal=="QNH") ? hh - t.alt : hh;
      if(h_rel<=0) continue;

      let finesseUse = (h_rel <= seuilVal) ? fbVal : f;
      let h_util = h_rel - margeVal;
      if(h_util<=0) continue;

      let d = h_util * finesseUse;

      let circle=L.circle([t.lat,t.lon],{
        radius:d,
        color:color(hh),
        weight:2,
        fill:false
      }).addTo(map);

      objs.push(circle);

      if(showLabels){
        [0,180].forEach(a=>{
          let rad=a*Math.PI/180;
          let latOff=(d/111000)*Math.cos(rad);
          let lonOff=(d/(111000*Math.cos(t.lat*Math.PI/180)))*Math.sin(rad);

          let lab=L.marker([t.lat+latOff,t.lon+lonOff],{
            icon:L.divIcon({
              className:'label',
              html:hh+"m-F"+Math.round(finesseUse)+"-"+t.id
            })
          }).addTo(map);

          objs.push(lab);
        });
      }
    }

    let m=L.marker([t.lat,t.lon]).addTo(map);
    objs.push(m);
  });
}

</script>

</body>
</html>
