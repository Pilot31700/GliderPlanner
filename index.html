<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PlanneurMob V15 - Vent intégré</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin:0; height:100%; }
#map { position:fixed; width:100%; height:100%; }

.panel {
  position:absolute;
  top:10px;
  left:10px;
  width:280px;
  background:rgba(240,240,240,0.95);
  padding:10px;
  border-radius:10px;
  font-family:sans-serif;
  z-index:1000;
  max-height:85vh;
  overflow:auto;
}

.toggleBtn {
  position:absolute;
  right:10px;
  z-index:1100;
  background:black;
  color:white;
  padding:8px;
  border-radius:8px;
}

.label {
  font-size:11px;
  font-weight:bold;
  background:rgba(255,255,255,0.8);
  padding:2px 4px;
  border-radius:4px;
}
</style>
</head>
<body>

<div id="map"></div>

<button class="toggleBtn" style="top:10px;" onclick="panel.style.display = panel.style.display==='none'?'block':'none'">⚙</button>
<button class="toggleBtn" style="top:60px;" onclick="toggleVent()">⚡</button>

<div id="panel" class="panel">

<b>Glide Planner V15</b><br><br>

Finesse: <input id="finesse" type="number" value="30"><br>
Finesse basse: <input id="fb" type="number" value="10"><br>
Seuil finesse basse: <input id="seuil" type="number" value="500"><br>
Marge: <input id="marge" type="number" value="250"><br>
<button onclick="update()">Recalculer</button>
<hr>

Hauteur: <span id="hVal">600</span><br>
<input id="slider" type="range" min="400" max="1500" step="100" value="600" oninput="update()"><br>

<input type="checkbox" id="all" onchange="update()"> Tous cercles 100m<br>
<input type="checkbox" id="labels" checked onchange="update()"> Labels<br>
<input type="checkbox" id="showConn" checked onchange="update()"> Zones atteignables<br>
<hr>

Mode:
<select id="mode" onchange="update()">
<option value="QFE">QFE</option>
<option value="QNH">QNH</option>
<option value="QFE_REF">QFE REF</option>
</select>

Terrain référence:
<select id="refSelect" onchange="update()"></select>

<hr>

Distance filtre (km):
<input id="rangeKm" type="number" value="100" onchange="update()">

</div>

<!-- MENU VENT -->
<div id="menuVent" class="panel" style="left:310px; display:none;">

<b>Vent multicouche</b><br><br>

<label><input type="checkbox" id="applyWind" onchange="update()"> Activer vent</label>

<hr>

<div id="windControls"></div>

</div>

<script>

// --- MAP ---
var map = L.map('map').setView([43.8,0.1],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// --- MENU VENT ---
function toggleVent(){
  let m = document.getElementById("menuVent");
  m.style.display = (m.style.display === "none") ? "block" : "none";
}

// --- POSITION ---
let userPos = {lat:43.8, lon:0.1};
map.on('moveend', ()=>{
  let c = map.getCenter();
  userPos = {lat:c.lat, lon:c.lng};
  update();
});

// --- DISTANCE ---
function distanceKm(a,b){
  let R=6371;
  let dLat=(b.lat-a.lat)*Math.PI/180;
  let dLon=(b.lon-a.lon)*Math.PI/180;
  let x = Math.sin(dLat/2)**2 +
          Math.cos(a.lat*Math.PI/180) *
          Math.cos(b.lat*Math.PI/180) *
          Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// --- TERRAINS ---
let terrainsAll = [
  {id:"LFDA",lat:43.709,lon:-0.249,alt:80},
  {id:"LFID",lat:43.955,lon:0.373,alt:130},
  {id:"LFCN",lat:43.762,lon:-0.036,alt:100},
  {id:"LFDH",lat:43.646,lon:0.601,alt:130}
];

let terrains=[];

// --- REF ---
function populateRef(){
  refSelect.innerHTML="";
  terrainsAll.forEach(t=>{
    let opt=document.createElement("option");
    opt.value=t.id;
    opt.innerText=t.id;
    refSelect.appendChild(opt);
  });
}
populateRef();

// --- COULEUR ---
function color(h){
  let r=Math.round(255*(1-(h-400)/1100));
  let g=Math.round(255*((h-400)/1100));
  return "rgb("+r+","+g+",0)";
}

// --- VENT ---
let windLayers = [];
for(let i=0;i<6;i++){
  windLayers.push({v:0,d:0});
}

// UI vent
function initWindUI(){
  let html="";
  for(let i=0;i<6;i++){
    let min=i*500, max=(i+1)*500;
    html+=`
    <b>${min}-${max} m</b><br>
    <input type="range" min="0" max="50" value="0" oninput="setWind(${i},this.value)">
    <span id="wlabel${i}">0 km/h</span><br>
    Direction: <input type="number" value="0" onchange="setDir(${i},this.value)"> °<br><br>
    `;
  }
  windControls.innerHTML=html;
}
initWindUI();

function setWind(i,v){
  windLayers[i].v=parseFloat(v);
  document.getElementById("wlabel"+i).innerText=v+" km/h";
}
function setDir(i,d){
  windLayers[i].d=parseFloat(d);
}

// --- DRAW ---
let objs=[];

function update(){

  objs.forEach(o=>map.removeLayer(o));
  objs=[];

  let range = parseFloat(rangeKm.value);
  terrains = terrainsAll.filter(t=>distanceKm(userPos,t)<=range);

  let h=parseInt(slider.value);
  hVal.innerText=h;

  let f=parseFloat(finesse.value);
  let fbVal=parseFloat(fb.value);
  let seuilVal=parseFloat(seuil.value);
  let margeVal=parseFloat(marge.value);
  let modeVal=mode.value;
  let showLabels=labels.checked;
  let allVal=all.checked;
  let useWind=applyWind.checked;

  let ref = terrainsAll.find(t => t.id === refSelect.value);
  let refAlt = ref?ref.alt:0;

  terrains.forEach(t=>{

    let hMin=allVal?400:h;
    let hMax=allVal?1500:h;

    for(let hh=hMin;hh<=hMax;hh+=100){

      let h_rel;
      if(modeVal==="QFE") h_rel=hh;
      else if(modeVal==="QNH") h_rel=hh-t.alt;
      else h_rel=hh-(t.alt-refAlt);

      if(h_rel<=0) continue;

      let finesseUse=(h_rel<=seuilVal)?fbVal:f;
      let h_util=h_rel-margeVal;
      if(h_util<=0) continue;

      let baseDist=h_util*finesseUse;

      let pts=[];

      for(let a=0;a<360;a+=10){

        let rad=a*Math.PI/180;
        let dist=baseDist;

        if(useWind){
          let idx=Math.floor(hh/500);
          let wind=windLayers[idx];
          let windRad=wind.d*Math.PI/180;
          let proj=Math.cos(windRad-rad);
          dist += wind.v*proj*40;
        }

        let latOff=(dist/111000)*Math.cos(rad);
        let lonOff=(dist/(111000*Math.cos(t.lat*Math.PI/180)))*Math.sin(rad);

        pts.push([t.lat+latOff,t.lon+lonOff]);
      }

      let poly=L.polygon(pts,{
        color:color(hh),
        weight:2,
        fill:false
      }).addTo(map);

      objs.push(poly);

      if(showLabels){
        let p=pts[0];
        let lab=L.marker(p,{
          icon:L.divIcon({className:'label',html:hh+"m-"+t.id})
        }).addTo(map);
        objs.push(lab);
      }
    }

    let m=L.marker([t.lat,t.lon]).addTo(map);
    objs.push(m);
  });
}

update();

map.on('click', function(e){
  let nom=prompt("Nom ?");
  let alt=parseFloat(prompt("Altitude ?"));
  if(!nom||isNaN(alt)) return;
  terrainsAll.push({id:nom,lat:e.latlng.lat,lon:e.latlng.lng,alt:alt});
  populateRef();
  update();
});

</script>
</body>
</html>
