<!-- ===== MODE VOL (complet, autonome) ===== -->
<style>
  /* Panel vol (visible uniquement en mode vol) */
  #volPanel {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 360px;
    background: rgba(255,255,255,0.98);
    padding: 12px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.22);
    z-index: 4000;
    pointer-events: auto;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    color: #111;
    display: none; /* controlled by JS depending on active screen */
  }

  #volPanel h4 { margin: 0 0 8px 0; font-size: 15px; }
  .volRow { font-size: 13px; margin-bottom: 8px; }
  .volRow label { display:block; font-weight:700; font-size:12px; color:#333; margin-bottom:6px; }

  /* Visual circle emphasis (Leaflet circle styling is set in JS) */
  .rangeIndicator {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:6px;
  }
  .rangeValue {
    font-weight:800;
    font-size:18px;
    color:#1f6feb;
  }
  .rangeUnit {
    font-size:12px;
    color:#444;
  }

  /* center button */
  #btnCenter {
    position: absolute;
    bottom: 20px;
    right: 20px;
    z-index: 4000;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    background: #1f6feb;
    color: white;
    font-size: 20px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.28);
    cursor: pointer;
    pointer-events: auto;
  }

  /* manual altitude container */
  #manualAltContainer { display:none; margin-top:8px; padding:8px; background:rgba(0,0,0,0.03); border-radius:8px; }
  #manualAlt { width:100%; }
  #altSource { font-size:12px; color:#666; margin-top:6px; }

  /* small responsive */
  @media (max-width:720px){
    #volPanel { width:92%; left:4%; transform:none; }
    #btnCenter { right:12px; bottom:12px; width:48px; height:48px; }
  }
</style>

<!-- Panel Mode Vol -->
<div id="volPanel" role="region" aria-label="Mode vol">
  <h4>Mode Vol</h4>

  <div class="volRow">
    <label><input type="checkbox" id="useGPSVol"> Utiliser GPS pour l'altitude</label>
  </div>

  <div class="volRow">
    <label for="finesseVol">Finesse haute</label>
    <input type="range" id="finesseVol" min="10" max="60" value="30">
  </div>

  <div class="volRow">
    <label for="fbVol">Finesse basse</label>
    <input type="range" id="fbVol" min="5" max="30" value="10">
  </div>

  <div class="volRow">
    <label for="seuilVol">Seuil (m)</label>
    <input type="range" id="seuilVol" min="0" max="2000" value="500">
    <input type="number" id="seuilInput" value="500" style="width:90px; margin-top:6px;">
  </div>

  <div class="volRow">
    <label for="margeVol">Marge (m)</label>
    <input type="number" id="margeVol" value="250" style="width:90px;">
  </div>

  <div class="volRow">
    <div>Altitude utilisée : <strong><span id="altDisplay">—</span> m</strong></div>
    <div id="altSource" aria-live="polite">Source : —</div>
  </div>

  <div id="manualAltContainer">
    <label for="manualAlt">Altitude manuelle (si GPS indisponible)</label>
    <input type="range" id="manualAlt" min="0" max="3000" step="1" value="600">
    <div style="display:flex; justify-content:space-between; margin-top:6px;">
      <small id="manualAltVal">600 m</small>
      <small style="font-size:12px;color:#666;">(utilisée si GPS indisponible ou GPS désactivé)</small>
    </div>
  </div>

  <div class="volRow rangeIndicator" style="margin-top:10px;">
    <div>
      <div style="font-size:12px;color:#666;">Portée estimée</div>
      <div class="rangeValue" id="porteeKm">—</div>
    </div>
    <div style="text-align:right;">
      <div class="rangeUnit">km</div>
      <div style="font-size:11px;color:#666;margin-top:6px;">(projection sol)</div>
    </div>
  </div>
</div>

<button id="btnCenter" aria-label="Centrer sur le planeur" aria-pressed="true">📍</button>

<script>
/*
  Mode Vol complet :
  - panneau visible uniquement en mode vol (contrôlé par aria-hidden des écrans)
  - GPS O/N intégré (#useGPSVol)
  - altitude manuelle si GPS indisponible
  - cercle très visuel (fill + stroke) représentant la projection sol
  - indicateur de portée en km (#porteeKm)
  - possibilité de revenir au menu principal : panel caché automatiquement si homeScreen actif
  - ne crée pas de menus sur l'écran d'accueil
*/

(function(){
  // Wait for map to be available
  function whenMapReady(cb) {
    if (window._glide_map) return cb(window._glide_map);
    let tries = 0;
    const t = setInterval(() => {
      tries++;
      if (window._glide_map) {
        clearInterval(t);
        cb(window._glide_map);
      } else if (tries > 40) {
        clearInterval(t);
        console.warn('Mode vol: map introuvable, abandon.');
      }
    }, 150);
  }

  whenMapReady(function(map){
    // DOM refs
    const volPanel = document.getElementById('volPanel');
    const btnCenter = document.getElementById('btnCenter');
    const useGPSVol = document.getElementById('useGPSVol');
    const finesseVol = document.getElementById('finesseVol');
    const fbVol = document.getElementById('fbVol');
    const seuilVol = document.getElementById('seuilVol');
    const seuilInput = document.getElementById('seuilInput');
    const margeVol = document.getElementById('margeVol');
    const altDisplay = document.getElementById('altDisplay');
    const altSource = document.getElementById('altSource');
    const manualAltContainer = document.getElementById('manualAltContainer');
    const manualAlt = document.getElementById('manualAlt');
    const manualAltVal = document.getElementById('manualAltVal');
    const porteeKmEl = document.getElementById('porteeKm');

    // Persist key
    const USE_GPS_KEY = 'glide:vol:useGPS';

    // State
    let autoCenter = true;
    let planeurPos = null;
    let altitudeGPS = null;
    let altitudeFiltered = null;
    let useGPS = true;

    // Layers (created once)
    let cercleVol = null;
    let markerPlaneur = null;

    // Throttle / center params
    let pendingUpdate = false;
    const UPDATE_MIN_MS = 180;
    const CENTER_MIN_DISTANCE_M = 8;
    let lastCenterTime = 0;
    let lastPos = null;

    // Restore persisted GPS preference
    try {
      const s = localStorage.getItem(USE_GPS_KEY);
      if (s !== null) useGPS = s === 'true';
    } catch (e) {}
    useGPSVol.checked = useGPS;

    // Panel visibility: show only when volScreen active and not on home
    function updatePanelVisibility() {
      const volScreen = document.getElementById('volScreen');
      const homeScreen = document.getElementById('homeScreen');
      const isVolActive = volScreen && volScreen.getAttribute('aria-hidden') !== 'true';
      const isHomeActive = homeScreen && homeScreen.getAttribute('aria-hidden') !== 'true';
      // show panel only when vol screen active and not on home
      volPanel.style.display = (isVolActive && !isHomeActive) ? 'block' : 'none';
      // center button visible only when not on home screen
      btnCenter.style.display = isHomeActive ? 'none' : 'block';
    }

    // Observe changes to aria-hidden on screens to toggle panel
    const screens = document.querySelectorAll('.screen');
    const obs = new MutationObserver(updatePanelVisibility);
    screens.forEach(s => obs.observe(s, { attributes: true, attributeFilter: ['aria-hidden'] }));
    updatePanelVisibility();

    // Utility: haversine meters
    function haversineMeters(a,b){
      const R = 6371000;
      const toRad = Math.PI/180;
      const dLat = (b.lat - a.lat) * toRad;
      const dLon = (b.lon - a.lon) * toRad;
      const lat1 = a.lat * toRad;
      const lat2 = b.lat * toRad;
      const x = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
      return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
    }

    // Ensure layers exist (create once)
    function ensureLayers(){
      if (!cercleVol) {
        cercleVol = L.circle([0,0], {
          radius: 0,
          color: 'rgba(31,111,235,0.95)',
          weight: 3.2,
          fillColor: 'rgba(31,111,235,0.16)',
          fillOpacity: 1,
          interactive: false
        }).addTo(map);
      }
      if (!markerPlaneur) {
        markerPlaneur = L.circleMarker([0,0], { radius: 6, color: '#ff2e2e', fillColor:'#ff2e2e', fillOpacity:1, interactive:false }).addTo(map);
      }
    }

    // Compute radius (m) from altitude
    function computeRadius(alt){
      const f = parseFloat(finesseVol.value) || 30;
      const fLow = parseFloat(fbVol.value) || 10;
      const seuilVal = parseFloat(seuilVol.value) || 500;
      const margeVal = parseFloat(margeVol.value) || 250;
      const finesseUse = (alt <= seuilVal) ? fLow : f;
      const hUtil = alt - margeVal;
      if (hUtil <= 0) return 0;
      return hUtil * finesseUse;
    }

    // Schedule update (throttle)
    function scheduleUpdate(){
      if (pendingUpdate) return;
      pendingUpdate = true;
      const now = Date.now();
      const delay = Math.max(0, UPDATE_MIN_MS - (now - (window._lastVolUpdate||0)));
      setTimeout(() => {
        pendingUpdate = false;
        window._lastVolUpdate = Date.now();
        doUpdate();
      }, delay);
    }

    // Actual update: update layers and UI
    function doUpdate(){
      if (!planeurPos) {
        altDisplay.innerText = '—';
        altSource.innerText = 'Source : —';
        porteeKmEl.innerText = '—';
        return;
      }
      ensureLayers();

      // decide altitude to use
      let altToUse = null;
      let source = '—';
      if (useGPS) {
        if (typeof altitudeFiltered === 'number' && !isNaN(altitudeFiltered)) {
          altToUse = altitudeFiltered;
          source = 'GPS';
        } else {
          altToUse = parseFloat(manualAlt.value) || 0;
          source = 'manuel (GPS indisponible)';
        }
      } else {
        altToUse = parseFloat(manualAlt.value) || 0;
        source = 'manuel (GPS désactivé)';
      }

      // update UI
      altDisplay.innerText = (typeof altToUse === 'number' && !isNaN(altToUse)) ? Math.round(altToUse) : '—';
      altSource.innerText = 'Source : ' + source;

      const radius = computeRadius(altToUse);

      // update circle and marker
      try {
        cercleVol.setLatLng([planeurPos.lat, planeurPos.lon]);
        cercleVol.setRadius(radius);
        markerPlaneur.setLatLng([planeurPos.lat, planeurPos.lon]);
      } catch (err) {
        console.warn('Mode vol: erreur mise à jour couches', err);
      }

      // update portée indicator in km (rounded to 2 decimals)
      const km = (radius / 1000);
      porteeKmEl.innerText = (km >= 0) ? (Math.round(km * 100) / 100).toFixed(2) : '—';

      // auto center: pan only if moved enough or after timeout
      if (autoCenter) {
        const now = Date.now();
        const moved = lastPos ? haversineMeters(lastPos, planeurPos) : Infinity;
        if (moved > CENTER_MIN_DISTANCE_M || (now - lastCenterTime) > 3000) {
          try {
            map.panTo([planeurPos.lat, planeurPos.lon], { animate: true });
          } catch(e){}
          lastCenterTime = now;
          lastPos = { ...planeurPos };
        }
      }
    }

    // Update manual UI visibility
    function updateManualUI(){
      const showManual = (!useGPS) || (useGPS && (altitudeFiltered === null || typeof altitudeFiltered !== 'number' || isNaN(altitudeFiltered)));
      manualAltContainer.style.display = showManual ? 'block' : 'none';
    }

    // Sync inputs
    seuilVol.oninput = () => { seuilInput.value = seuilVol.value; scheduleUpdate(); };
    seuilInput.onchange = () => { seuilVol.value = seuilInput.value; scheduleUpdate(); };
    [finesseVol, fbVol, margeVol].forEach(el => { if (el) el.addEventListener('input', scheduleUpdate); });
    manualAlt.addEventListener('input', () => { manualAltVal.innerText = manualAlt.value + ' m'; scheduleUpdate(); });

    // Center button
    btnCenter.addEventListener('click', () => {
      autoCenter = true;
      btnCenter.setAttribute('aria-pressed','true');
      if (planeurPos) map.panTo([planeurPos.lat, planeurPos.lon], { animate: true });
    });

    map.on('dragstart', () => {
      autoCenter = false;
      btnCenter.setAttribute('aria-pressed','false');
    });

    // GPS checkbox
    useGPSVol.addEventListener('change', () => {
      useGPS = !!useGPSVol.checked;
      try { localStorage.setItem(USE_GPS_KEY, String(useGPS)); } catch(e){}
      updateManualUI();
      scheduleUpdate();
    });

    // Watch position (defensive)
    if (navigator.geolocation) {
      try {
        navigator.geolocation.watchPosition((pos) => {
          planeurPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
          altitudeGPS = (typeof pos.coords.altitude === 'number') ? pos.coords.altitude : null;
          if (altitudeGPS === null) {
            // keep previous filtered value
          } else if (altitudeFiltered === null || typeof altitudeFiltered !== 'number') {
            altitudeFiltered = altitudeGPS;
          } else {
            altitudeFiltered = altitudeFiltered * 0.7 + altitudeGPS * 0.3;
          }
          updateManualUI();
          scheduleUpdate();
        }, (err) => {
          console.warn('Mode vol: GPS error', err);
          altitudeGPS = null;
          altitudeFiltered = null;
          updateManualUI();
          scheduleUpdate();
        }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 });
      } catch (e) {
        console.warn('Mode vol: watchPosition failed', e);
      }
    } else {
      altitudeGPS = null;
      altitudeFiltered = null;
      updateManualUI();
    }

    // Ensure layers exist and initial draw
    ensureLayers();
    scheduleUpdate();

    // Expose debug handle
    window._volMode = {
      scheduleUpdate, doUpdate, ensureLayers, getState: () => ({ planeurPos, altitudeGPS, altitudeFiltered, useGPS, autoCenter })
    };

    // Safety: hide vol UI if home screen is active (avoid opening menus on home)
    updatePanelVisibility();

  }); // whenMapReady
})();
</script>
