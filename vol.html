<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Glide Planner – Mode Vol</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --accent:#1f6feb;
      --panel-bg: rgba(250,250,250,0.96);
      --panel-shadow: 0 6px 18px rgba(20,20,20,0.18);
    }

    html, body {
      margin:0;
      height:100%;
      font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    }

    #map {
      position:fixed;
      inset:0;
      z-index:1;
      background:#eaeaea;
    }

    /* Bouton menu */
    #vol-btnMenu {
      position:absolute;
      top:12px;
      left:12px;
      z-index:3000;
      width:48px;
      height:48px;
      border-radius:12px;
      border:none;
      background:var(--accent);
      color:white;
      font-size:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(31,111,235,0.25);
    }

    /* Bouton recentrer */
    #vol-btnCenter {
      position:absolute;
      bottom:20px;
      right:20px;
      width:52px;
      height:52px;
      border-radius:50%;
      border:none;
      background:var(--accent);
      color:white;
      font-size:22px;
      cursor:pointer;
      z-index:3000;
      box-shadow:0 8px 20px rgba(31,111,235,0.25);
      display:none;
    }

    /* Panneau */
    #vol-panel {
      position:absolute;
      top:72px;
      left:12px;
      width:330px;
      background:var(--panel-bg);
      border-radius:12px;
      padding:12px;
      box-shadow:var(--panel-shadow);
      z-index:3000;
      border:1px solid rgba(20,20,20,0.06);
      max-height:80vh;
      overflow:auto;
      display:none;
      touch-action:none;
      cursor:grab;
    }

    #vol-panel h3 {
      margin:0 0 8px 0;
      font-size:16px;
      color:#0b1220;
    }

    .vol-field {
      margin-bottom:10px;
      font-size:13px;
      color:#222;
    }

    .vol-field label {
      font-size:12px;
      font-weight:600;
      display:block;
      margin-bottom:4px;
    }

    .vol-row {
      display:flex;
      align-items:center;
      gap:8px;
    }

    .vol-row input[type="range"] {
      flex:1;
    }

    .vol-val {
      width:60px;
      text-align:right;
      font-weight:700;
      color:var(--accent);
    }

    .vol-radio-inline {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      font-size:12px;
    }

    select, input[type="number"] {
      padding:4px 6px;
      border-radius:6px;
      border:1px solid #ddd;
      font-size:13px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <button id="vol-btnMenu">✈</button>
  <button id="vol-btnCenter">◎</button>

  <div id="vol-panel">
    <h3>Mode Vol</h3>

    <div class="vol-field">
      <label>Source altitude</label>
      <div class="vol-radio-inline">
        <label><input type="radio" name="vol-altSrc" value="auto" checked> Auto</label>
        <label><input type="radio" name="vol-altSrc" value="gps"> GPS</label>
        <label><input type="radio" name="vol-altSrc" value="manual"> Manuel</label>
      </div>
    </div>

    <div class="vol-field">
      <label>Altitude manuelle (m)</label>
      <input id="vol-altManual" type="number" value="1000" min="0" step="10">
    </div>

    <div class="vol-field">
      <label>Calage altimétrique</label>
      <select id="vol-altMode">
        <option value="QNH">QNH</option>
        <option value="QFE_NEAREST">QFE terrain le plus proche</option>
        <option value="QFE_REF">QFE terrain de référence</option>
      </select>
    </div>

    <div class="vol-field">
      <label>Terrain de référence</label>
      <select id="vol-refSelect"></select>
    </div>

    <div class="vol-field">
      <label>Finesse</label>
      <div class="vol-row">
        <input id="vol-fin" type="range" min="10" max="60" step="1" value="30">
        <div class="vol-val" id="vol-finVal">30</div>
      </div>
    </div>

    <div class="vol-field">
      <label>Finesse basse</label>
      <div class="vol-row">
        <input id="vol-finLow" type="range" min="5" max="30" step="1" value="10">
        <div class="vol-val" id="vol-finLowVal">10</div>
      </div>
    </div>

    <div class="vol-field">
      <label>Seuil (m)</label>
      <div class="vol-row">
        <input id="vol-seuil" type="range" min="0" max="3000" step="50" value="500">
        <input id="vol-seuilNum" type="number" value="500" min="0" max="3000" step="50" style="width:70px;">
      </div>
    </div>

    <div class="vol-field">
      <label>Marge (m)</label>
      <input id="vol-marge" type="number" value="250" min="0" step="10">
    </div>

    <hr>

    <div class="vol-field">
      <label>Altitude</label>
      <div id="vol-altDisplay">Altitude : — m</div>
      <div id="vol-altRefDisplay">Calée : — m</div>
    </div>

    <div class="vol-field">
      <label>Rayon finesse</label>
      <div id="vol-radiusDisplay">— km</div>
    </div>
  </div>

  <script>
    // -----------------------------
    // MAP
    // -----------------------------
    const map = L.map('map').setView([43.8, 0.1], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19
    }).addTo(map);

    const planeIcon = L.icon({
      iconUrl:"https://cdn-icons-png.flaticon.com/512/684/684908.png",
      iconSize:[32,32],
      iconAnchor:[16,16]
    });

    let planePos = { lat:43.8, lon:0.1 };
    let planeMarker = L.marker([planePos.lat, planePos.lon], { icon:planeIcon }).addTo(map);

    // -----------------------------
    // TERRAIN JSON
    // -----------------------------
    let terrains = [];

    fetch("terrains.json")
      .then(r => r.json())
      .then(data => {
        terrains = data;
        populateRef();
        updateVol();
      });

    function populateRef() {
      const sel = document.getElementById("vol-refSelect");
      sel.innerHTML = "";
      terrains.forEach(t => {
        const o = document.createElement("option");
        o.value = t.id;
        o.textContent = t.id;
        sel.appendChild(o);
      });
    }

    // -----------------------------
    // DOM
    // -----------------------------
    const btnMenu = document.getElementById("vol-btnMenu");
    const btnCenter = document.getElementById("vol-btnCenter");
    const panel = document.getElementById("vol-panel");

    const finSlider = document.getElementById("vol-fin");
    const finVal = document.getElementById("vol-finVal");
    const finLowSlider = document.getElementById("vol-finLow");
    const finLowVal = document.getElementById("vol-finLowVal");
    const seuilSlider = document.getElementById("vol-seuil");
    const seuilNum = document.getElementById("vol-seuilNum");
    const margeInput = document.getElementById("vol-marge");
    const altManual = document.getElementById("vol-altManual");
    const altModeSelect = document.getElementById("vol-altMode");
    const refSelect = document.getElementById("vol-refSelect");
    const altDisplay = document.getElementById("vol-altDisplay");
    const altRefDisplay = document.getElementById("vol-altRefDisplay");
    const radiusDisplay = document.getElementById("vol-radiusDisplay");
    const altSrcRadios = document.querySelectorAll('input[name="vol-altSrc"]');

    // -----------------------------
    // UTILS
    // -----------------------------
    function distanceKm(a, b) {
      const R = 6371;
      const dLat = (b.lat - a.lat) * Math.PI/180;
      const dLon = (b.lon - a.lon) * Math.PI/180;
      const x = Math.sin(dLat/2)**2 +
        Math.cos(a.lat*Math.PI/180) *
        Math.cos(b.lat*Math.PI/180) *
        Math.sin(dLon/2)**2;
      return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
    }

    function getAltSrc() {
      let v = "auto";
      altSrcRadios.forEach(r => { if (r.checked) v = r.value; });
      return v;
    }

    function getNearestTerrain(pos) {
      if (!terrains.length) return null;
      let best = terrains[0];
      let bestD = distanceKm(pos, best);
      for (let i=1;i<terrains.length;i++){
        const d = distanceKm(pos, terrains[i]);
        if (d < bestD) {
          bestD = d;
          best = terrains[i];
        }
      }
      return best;
    }

    // -----------------------------
    // ÉTAT
    // -----------------------------
    let gpsAlt = null;
    let circlePlane = null;
    let objsTerrains = [];

    function clearTerrains() {
      objsTerrains.forEach(o => map.removeLayer(o));
      objsTerrains = [];
    }

    // -----------------------------
    // CALCUL PRINCIPAL
    // -----------------------------
    function updateVol() {
      if (!terrains.length) return;

      // 1) Altitude source (QNH)
      const src = getAltSrc();
      let altQNH = null;

      if (src === "gps") {
        altQNH = gpsAlt;
      } else if (src === "manual") {
        altQNH = parseFloat(altManual.value);
      } else {
        altQNH = gpsAlt != null ? gpsAlt : parseFloat(altManual.value);
      }

      if (!altQNH || isNaN(altQNH)) {
        altDisplay.textContent = "Altitude : — m";
        altRefDisplay.textContent = "Calée : — m";
        return;
      }

      altDisplay.textContent = "Altitude : " + Math.round(altQNH) + " m";

      // 2) Calage
      const modeAlt = altModeSelect.value;
      let refAlt = 0;
      let refLabel = "QNH";

      if (modeAlt === "QFE_NEAREST") {
        const nearest = getNearestTerrain(planePos);
        if (nearest) {
          refAlt = nearest.alt;
          refLabel = "QFE " + nearest.id;
        }
      } else if (modeAlt === "QFE_REF") {
        const ref = terrains.find(t => t.id === refSelect.value);
        if (ref) {
          refAlt = ref.alt;
          refLabel = "QFE " + ref.id;
        }
      }

      const altRef = altQNH - refAlt;
      altRefDisplay.textContent = "Calée : " + Math.round(altRef) + " m (" + refLabel + ")";

      // 3) Paramètres finesse
      const fin = parseFloat(finSlider.value);
      const finLow = parseFloat(finLowSlider.value);
      const seuil = parseFloat(seuilNum.value);
      const marge = parseFloat(margeInput.value);

      // 4) Cercle planeur
      if (circlePlane) map.removeLayer(circlePlane);

      let glideRadiusMeters = 0;
      let glideRadiusKm = 0;

      const finesseUse = (altRef <= seuil) ? finLow : fin;
      const h_util = altRef - marge;

      if (h_util > 0) {
        glideRadiusMeters = h_util * finesseUse;
        glideRadiusKm = glideRadiusMeters / 1000;

        circlePlane = L.circle([planePos.lat, planePos.lon], {
          radius: glideRadiusMeters,
          color:"#1f6feb",
          weight:2,
          fill:false
        }).addTo(map);

        radiusDisplay.textContent = glideRadiusKm.toFixed(1) + " km";
      } else {
        radiusDisplay.textContent = "— km";
      }

      // 5) Cercles terrains filtrés
      clearTerrains();

      const planeMSL = altQNH;
      const filterKm = glideRadiusKm + 10;

      terrains.forEach(t => {
        const d = distanceKm(planePos, t);
        if (d > filterKm) return;

        const h_rel = planeMSL - t.alt;
        if (h_rel <= 0) return;

        const fUse = (h_rel <= seuil) ? finLow : fin;
        const h_util_t = h_rel - marge;
        if (h_util_t <= 0) return;

        const d_t = h_util_t * fUse;

        const c = L.circle([t.lat, t.lon], {
          radius:d_t,
          color:"orange",
          weight:2,
          fill:false
        }).addTo(map);
        objsTerrains.push(c);

        const m = L.marker([t.lat, t.lon]).addTo(map);
        objsTerrains.push(m);
      });

      btnCenter.style.display = "block";
    }

    // -----------------------------
    // GEOLOCALISATION
    // -----------------------------
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        pos => {
          const { latitude, longitude, altitude } = pos.coords;
          planePos = { lat:latitude, lon:longitude };
          planeMarker.setLatLng([planePos.lat, planePos.lon]);
          map.setView([planePos.lat, planePos.lon], map.getZoom());
          if (typeof altitude === "number") gpsAlt = altitude;
          updateVol();
        },
        () => {},
        { enableHighAccuracy:true, maximumAge:10000, timeout:10000 }
      );
    }

    // -----------------------------
    // UI EVENTS
    // -----------------------------
    btnMenu.addEventListener("click", () => {
      panel.style.display = (panel.style.display === "block") ? "none" : "block";
    });

    btnCenter.addEventListener("click", () => {
      map.setView([planePos.lat, planePos.lon], map.getZoom());
    });

    finSlider.addEventListener("input", () => { finVal.textContent = finSlider.value; updateVol(); });
    finLowSlider.addEventListener("input", () => { finLowVal.textContent = finLowSlider.value; updateVol(); });

    seuilSlider.addEventListener("input", () => {
      seuilNum.value = seuilSlider.value;
      updateVol();
    });

    seuilNum.addEventListener("input", () => {
      seuilSlider.value = seuilNum.value;
      updateVol();
    });

    margeInput.addEventListener("input", updateVol);
    altManual.addEventListener("input", updateVol);
    altModeSelect.addEventListener("change", updateVol);
    refSelect.addEventListener("change", updateVol);
    altSrcRadios.forEach(r => r.addEventListener("change", updateVol));

    // -----------------------------
    // DRAG PANEL
    // -----------------------------
    (function makeDraggable(el){
      let dragging = false;
      let offsetX = 0;
      let offsetY = 0;

      el.addEventListener("pointerdown", e => {
        if (e.target.closest("input,select,button")) return;
        dragging = true;
        el.setPointerCapture(e.pointerId);
        offsetX = e.clientX - el.offsetLeft;
        offsetY = e.clientY - el.offsetTop;
        el.style.cursor = "grabbing";
      });

      el.addEventListener("pointermove", e => {
        if (!dragging) return;
        let left = e.clientX - offsetX;
        let top = e.clientY - offsetY;
        left = Math.max(0, Math.min(window.innerWidth - el.offsetWidth, left));
        top = Math.max(0, Math.min(window.innerHeight - el.offsetHeight, top));
        el.style.left = left + "px";
        el.style.top = top + "px";
      });

      el.addEventListener("pointerup", e => {
        dragging = false;
        el.releasePointerCapture(e.pointerId);
        el.style.cursor = "grab";
      });
    })(panel);
